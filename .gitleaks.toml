title = "Pokemon RPG secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Non-secret domain idempotency, policy, and offer identifiers"
regexTarget = "match"
regexes = [
  '''(?i)(?:idempotency|policy|offer)key\s*[:=]\s*["'`]?[a-z0-9][a-z0-9._:/-]{2,149}["'`]?''',
]

[[allowlists]]
description = "Documented Cloudflare Access identity example shape"
regexTarget = "line"
regexes = [
  '''cloudflare-access:example\.cloudflareaccess\.com:[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}''',
]
