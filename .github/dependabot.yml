version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Maceio
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Maceio
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
