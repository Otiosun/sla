name: WIP Phase 15 Type Fix

on:
  push:
    branches:
      - feat/phase15-gen123-import-wip

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase15-gen123-import-wip
      - name: Patch modern type taxonomy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("db/imports/gen123/model.ts")
          s = p.read_text()
          start = s.index("  const typeRows = typeRowsAll.filter(")
          end = s.index("  const allowedTypeIds", start)
          replacement = '''  // Ruleset v1 uses the modern 18-type taxonomy while species/move identity scope is Gen I-III.\n  // This preserves official retroactive typings such as Clefairy -> Fairy.\n  const typeRows = typeRowsAll.filter((row) => requiredInt(row, "id") <= 18);\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Commit code fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/imports/gen123/model.ts
          git diff --cached --quiet && exit 0
          git commit -m "wip: align Gen I-III catalog with v1 modern type taxonomy"
          git push origin HEAD:feat/phase15-gen123-import-wip
