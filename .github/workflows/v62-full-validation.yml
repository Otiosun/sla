name: V62 Full Validation

on:
  push:
    branches:
      - "feature/spawn-battle-director-v62"

permissions:
  contents: read

concurrency:
  group: v62-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      POSTGRES_INTEGRATION_TEST_URL: postgresql://pokemon:test-only-password@localhost:5432/postgres
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
      BELL_WORLD_TIME_OF_DAY: DAY
      DATABASE_POOL_MAX: 12
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      DATABASE_IDLE_TIMEOUT_MS: 30000
      DATABASE_QUERY_TIMEOUT_MS: 10000
      DATABASE_STATEMENT_TIMEOUT_MS: 10000
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: 15000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test --tuples-only --command "SELECT 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Full test suite
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify database schema
        run: pnpm db:verify
