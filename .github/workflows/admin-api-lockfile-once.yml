name: Admin API Lockfile Once

on:
  pull_request:

permissions:
  contents: write

env:
  APP_ENV: test

jobs:
  generate:
    if: github.head_ref == 'feat/admin-api-read-foundation-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/admin-api-read-foundation-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0
      - name: Generate exact Fastify lockfile
        run: pnpm add fastify@5.12.1 --save-exact --lockfile-only
      - name: Validate frozen lockfile and supply-chain policy
        run: pnpm install --frozen-lockfile
      - name: Commit generated package files
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Package files already match the generated result."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "build(admin-api): add Fastify 5.12.1 lockfile"
          git push origin HEAD:feat/admin-api-read-foundation-v1
