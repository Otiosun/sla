name: Temporary Phase 17 qrcode lock generator

on:
  push:
    branches:
      - feat/phase17-whatsapp-pairing-bootstrap-v1
    paths:
      - .github/workflows/tmp-phase17-add-qrcode-terminal.yml

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase17-whatsapp-pairing-bootstrap-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Generate package and lockfile
        run: pnpm add qrcode-terminal@0.12.0 --save-exact --lockfile-only --ignore-scripts

      - name: Commit generated dependency metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency metadata changes to commit."
            exit 0
          fi
          git commit -m "chore: add qrcode-terminal exact dependency"
          git push origin HEAD:feat/phase17-whatsapp-pairing-bootstrap-v1
