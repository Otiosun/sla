name: Capture Proof Format Temp

on:
  push:
    branches:
      - feat/capture-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/capture-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
          check-latest: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 10 proof
        run: pnpm exec biome format --write db/proofs/phase10_capture_e2e.ts

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- db/proofs/phase10_capture_e2e.ts; then
            echo "Phase 10 proof already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/proofs/phase10_capture_e2e.ts
          git commit -m "chore(format): apply Biome to capture proof"
          git push origin HEAD:feat/capture-v1
