name: Phase 12B Fixture Fix Temp

on:
  push:
    branches:
      - work/phase12b-player360-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/phase12b-player360-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - name: Respect canonical lifecycle and condition contracts in Player 360 fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path('db/proofs/phase12_player360_e2e.ts')
          text = path.read_text()
          start_marker = '  await pool.query(\n    `INSERT INTO rulesets('
          next_marker = '  await pool.query(`INSERT INTO pokemon_species'
          start = text.find(start_marker)
          end = text.find(next_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Player 360 fixture lifecycle anchors not found')
          replacement = '''  await pool.query(
            `INSERT INTO rulesets(id, key, version, engine_contract_version, config, status)
             VALUES ($1, $2, 1, 1, '{}'::jsonb, 'DRAFT')`,
            [rulesetId, `player360-proof-${rulesetId}`],
          );
          await pool.query(
            `UPDATE rulesets
             SET status = 'VALIDATED', validated_at = now(),
                 validation_report = '{"proof":true}'::jsonb,
                 config_fingerprint = repeat('a', 64)
             WHERE id = $1`,
            [rulesetId],
          );
          await pool.query(
            `UPDATE rulesets SET status = 'PUBLISHED', published_at = now() WHERE id = $1`,
            [rulesetId],
          );
          await pool.query(
            `INSERT INTO content_releases(
               id, release_no, name, status, default_ruleset_id
             ) VALUES ($1, 900001, 'Player 360 proof', 'DRAFT', $2)`,
            [releaseId, rulesetId],
          );
          await pool.query(
            `UPDATE content_releases
             SET status = 'VALIDATED', validated_at = now(),
                 validation_report = '{"proof":true}'::jsonb,
                 content_fingerprint = repeat('b', 64)
             WHERE id = $1`,
            [releaseId],
          );
          await pool.query(
            `UPDATE content_releases SET status = 'PUBLISHED', published_at = now() WHERE id = $1`,
            [releaseId],
          );
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace("'FRIENDSHIP_READY'", "'friendship-ready'")
          path.write_text(text)
      - run: pnpm exec biome format --write db/proofs/phase12_player360_e2e.ts
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test \
              --set ON_ERROR_STOP=1 --tuples-only --command "SELECT 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1
      - run: pnpm db:migrate
      - run: |
          pnpm db:seed:phase12
          pnpm db:seed:phase12
      - run: pnpm db:verify
      - run: pnpm exec vitest run tests/admin
      - run: node --import tsx db/proofs/phase12_admin_registry_e2e.ts
      - run: node --import tsx db/proofs/phase12_player360_e2e.ts
      - name: Commit validated fixture only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/proofs/phase12_player360_e2e.ts
          git commit -m 'test: respect canonical contracts in Player 360 proof'
          git push origin HEAD:work/phase12b-player360-v1
