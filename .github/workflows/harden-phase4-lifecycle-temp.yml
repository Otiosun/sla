name: Temporary Phase 4 Lifecycle Hardening

on:
  push:
    branches:
      - feat/catalog-ruleset-release-v1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply lifecycle hardening
        run: python scripts/harden_phase4_temp.py

      - name: Commit hardening and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/harden_phase4_temp.py .github/workflows/harden-phase4-lifecycle-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/migrations/0003_catalog_release_lifecycle.sql tests/db/schema.integration.test.ts
          git commit -m "fix(catalog): enforce draft-first lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
