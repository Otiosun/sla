name: Premium Local Current Baseline Gate

on:
  pull_request:
    paths:
      - "src/modules/premium-orders/**"
      - "src/modules/player-portal/http-handler.ts"
      - "src/runtime/**"
      - "db/migrations/0076_*"
      - "db/migrations/0077_*"
      - "tests/player/manual-master*"
      - "tests/runtime/player-portal-runtime-config.test.ts"
      - ".github/workflows/premium-local-current-baseline-gate.yml"

permissions:
  contents: read

jobs:
  isolated-contract:
    name: TypeScript and disposable PostgreSQL only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact dependency versions
        run: |
          npm install --global pnpm@11.23.0
          pnpm install --frozen-lockfile
      - name: Typecheck candidate
        run: pnpm typecheck
      - name: Manual delivery contracts and live portal regression
        run: pnpm exec vitest run tests/player/manual-master-ball-pack-handler.test.ts tests/player/manual-master-ball-session.test.ts tests/player/manual-master-ball-contracts.test.ts tests/player/player-portal-http-handler.test.ts tests/runtime/player-portal-runtime-config.test.ts
      - name: Start disposable PostgreSQL (NOT the game database)
        run: |
          docker run -d --name premium-proof-db \
            -e POSTGRES_USER=pokemon \
            -e POSTGRES_PASSWORD=test-only-password \
            -e POSTGRES_DB=pokemon_rpg_test \
            -p 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec premium-proof-db psql -U pokemon -d pokemon_rpg_test -tAc 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs premium-proof-db
          exit 1
      - name: Apply candidate migrations to disposable database
        run: pnpm db:migrate
      - name: Verify full candidate schema
        run: pnpm db:verify
