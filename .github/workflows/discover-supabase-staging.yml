name: Discover Supabase Staging Project

on:
  push:
    branches:
      - gate/hub-profile-customization-v1

permissions:
  contents: read

jobs:
  discover:
    name: list accessible Supabase projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_JIT_TOKEN }}
      CONFIGURED_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}

    steps:
      - name: Discover projects without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "Supabase access token missing" >&2; exit 64; }

          response="$(curl --fail-with-body --silent --show-error             https://api.supabase.com/v1/projects             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          echo "$response" | jq -e 'type == "array"' >/dev/null
          safe_projects="$(echo "$response" | jq -c '[.[] | {ref, name, status, region}]')"
          active_count="$(echo "$response" | jq '[.[] | select(.status == "ACTIVE_HEALTHY" or .status == "ACTIVE_UNHEALTHY")] | length')"
          configured_present="$(echo "$response" | jq --arg ref "$CONFIGURED_PROJECT_REF" 'any(.[]; .ref == $ref)')"

          echo "configured_ref=$CONFIGURED_PROJECT_REF"
          echo "configured_ref_present=$configured_present"
          echo "active_project_count=$active_count"
          echo "accessible_projects=$safe_projects"

          if [[ "$configured_present" != "true" ]]; then
            echo "Configured staging Supabase project ref is not among accessible projects." >&2
            exit 42
          fi
