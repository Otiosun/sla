name: Pokemon Beyond Cross-Module Staging Regression

on:
  pull_request:
    branches:
      - fix/ux-combat-contextual-reconciliation-20261102
    paths:
      - ".github/workflows/release-candidate-crossmodule-regression.yml"
      - "src/modules/exploration/**"
      - "src/modules/capture/**"
      - "src/modules/battle/**"
      - "src/modules/pvp/**"
      - "src/platform/pvp/**"
      - "tests/pvp/**"
      - "tests/db/pvp-challenge-repository.integration.test.ts"
      - "src/modules/encounter/**"
      - "src/modules/messaging/**"
      - "src/platform/exploration/**"
      - "src/platform/capture/**"
      - "src/platform/battle/**"
      - "src/platform/encounter/**"
      - "src/platform/messaging/**"
      - "tests/exploration/**"
      - "tests/capture/**"
      - "tests/battle/**"
      - "tests/encounter/**"
      - "tests/messaging/**"
      - "tests/db/solo-expedition-repository.integration.test.ts"

permissions:
  contents: read

jobs:
  crossmodule-regression:
    name: Capture Battle Encounter Messaging Exploration Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      NODE_ENV: test
      WHATSAPP_ENABLED: "false"
      DATABASE_URL: postgresql://pokemon:test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: |
          npm install --global pnpm@11.23.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify isolated staging inputs and deny live endpoints
        run: |
          test "$APP_ENV" = test
          test "$WHATSAPP_ENABLED" = false
          test ! -e .env
          test ! -e .env.local
          test ! -d auth_info_baileys
          node -e "const u=new URL(process.env.DATABASE_URL);if(u.hostname!=='127.0.0.1'||u.port!=='5432'||u.pathname!=='/postgres')process.exit(1)"
      - name: Prove cross-module regressions on ephemeral PostgreSQL
        run: pnpm exec vitest run tests/capture tests/battle tests/encounter tests/messaging tests/exploration tests/pvp
      - name: Confirm TypeScript contract
        run: pnpm exec tsc --noEmit
