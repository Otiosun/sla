          files = {
          'db/migrations/0011_admin_operation_registry_integrity.sql': r'''-- 0011_admin_operation_registry_integrity.sql
-- Hardens the pre-existing admin authorization/operation spine without replacing it.

ALTER TABLE admin_principals
  ADD COLUMN revision BIGINT NOT NULL DEFAULT 0 CHECK (revision >= 0);

ALTER TABLE admin_roles
  ADD COLUMN revision BIGINT NOT NULL DEFAULT 0 CHECK (revision >= 0);

ALTER TABLE capabilities
  ADD COLUMN revision BIGINT NOT NULL DEFAULT 0 CHECK (revision >= 0);

ALTER TABLE admin_operations
  DROP CONSTRAINT IF EXISTS admin_operations_status_check;

ALTER TABLE admin_operations
  ADD CONSTRAINT admin_operations_status_check
  CHECK (status IN (
    'DRAFT', 'VALIDATED', 'SIMULATED', 'PENDING_CONFIRMATION', 'PENDING_APPROVAL',
    'READY', 'APPLIED', 'REJECTED', 'FAILED', 'COMPENSATED'
  ));

ALTER TABLE admin_operations
  ALTER COLUMN reason DROP NOT NULL,
  ADD COLUMN request_fingerprint TEXT,
  ADD COLUMN policy_version INTEGER NOT NULL DEFAULT 1 CHECK (policy_version > 0),
  ADD COLUMN requires_simulation BOOLEAN NOT NULL DEFAULT FALSE,
  ADD COLUMN requires_confirmation BOOLEAN NOT NULL DEFAULT FALSE,
  ADD COLUMN required_approvals SMALLINT NOT NULL DEFAULT 0 CHECK (required_approvals BETWEEN 0 AND 2),
  ADD COLUMN revision BIGINT NOT NULL DEFAULT 0 CHECK (revision >= 0),
  ADD COLUMN updated_at TIMESTAMPTZ NOT NULL DEFAULT now();

UPDATE admin_operations
SET request_fingerprint = 'legacy:' || id::text
WHERE request_fingerprint IS NULL;

ALTER TABLE admin_operations
  ALTER COLUMN request_fingerprint SET NOT NULL,
  ADD CONSTRAINT admin_operations_sensitive_reason_check
    CHECK (risk_tier < 2 OR (reason IS NOT NULL AND length(btrim(reason)) > 0)),
  ADD CONSTRAINT admin_operations_applied_at_check
    CHECK (
      (status IN ('APPLIED', 'COMPENSATED') AND applied_at IS NOT NULL)
      OR (status NOT IN ('APPLIED', 'COMPENSATED') AND applied_at IS NULL)
    );

CREATE INDEX idx_admin_operations_status_created
  ON admin_operations(status, created_at);

CREATE TABLE admin_principal_scopes (
  id UUID PRIMARY KEY,
  principal_id UUID NOT NULL REFERENCES admin_principals(id),
  scope_type TEXT NOT NULL CHECK (scope_type IN ('GLOBAL', 'PLAYER', 'REGION', 'AREA')),
  scope_id UUID NULL,
  status TEXT NOT NULL DEFAULT 'ACTIVE' CHECK (status IN ('ACTIVE', 'REVOKED')),
  revision BIGINT NOT NULL DEFAULT 0 CHECK (revision >= 0),
  created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  revoked_at TIMESTAMPTZ NULL,
  CHECK (
    (scope_type = 'GLOBAL' AND scope_id IS NULL)
    OR (scope_type <> 'GLOBAL' AND scope_id IS NOT NULL)
  ),
  CHECK (
    (status = 'ACTIVE' AND revoked_at IS NULL)
    OR (status = 'REVOKED' AND revoked_at IS NOT NULL)
  )
);

CREATE UNIQUE INDEX uq_admin_principal_scopes_active
  ON admin_principal_scopes(
    principal_id,
    scope_type,
    COALESCE(scope_id, '00000000-0000-0000-0000-000000000000'::uuid)
  )
  WHERE status = 'ACTIVE';

CREATE INDEX idx_admin_principal_scopes_principal
  ON admin_principal_scopes(principal_id, status);

CREATE TABLE admin_operation_confirmations (
  id UUID PRIMARY KEY,
  admin_operation_id UUID NOT NULL REFERENCES admin_operations(id),
  principal_id UUID NOT NULL REFERENCES admin_principals(id),
  request_fingerprint TEXT NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  UNIQUE (admin_operation_id, principal_id)
);

CREATE INDEX idx_admin_operation_confirmations_operation
  ON admin_operation_confirmations(admin_operation_id, created_at);

CREATE TABLE admin_operation_approvals (
  id UUID PRIMARY KEY,
  admin_operation_id UUID NOT NULL REFERENCES admin_operations(id),
  principal_id UUID NOT NULL REFERENCES admin_principals(id),
  request_fingerprint TEXT NOT NULL,
  decision TEXT NOT NULL CHECK (decision IN ('APPROVED', 'REJECTED')),
  reason TEXT NOT NULL CHECK (length(btrim(reason)) > 0),
  created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
  UNIQUE (admin_operation_id, principal_id)
);

CREATE INDEX idx_admin_operation_approvals_operation
  ON admin_operation_approvals(admin_operation_id, created_at);
''',

          'src/modules/admin/contracts.ts': r'''import { z } from "zod";

export const AdminRiskTierSchema = z.union([
  z.literal(0),
  z.literal(1),
  z.literal(2),
  z.literal(3),
  z.literal(4),
]);
export type AdminRiskTier = z.infer<typeof AdminRiskTierSchema>;

export const AdminScopeTypeSchema = z.enum(["GLOBAL", "PLAYER", "REGION", "AREA"]);
export type AdminScopeType = z.infer<typeof AdminScopeTypeSchema>;

export const AdminOperationStatusSchema = z.enum([
  "DRAFT",
  "VALIDATED",
  "SIMULATED",
  "PENDING_CONFIRMATION",
  "PENDING_APPROVAL",
  "READY",
  "APPLIED",
  "REJECTED",
  "FAILED",
  "COMPENSATED",
]);
export type AdminOperationStatus = z.infer<typeof AdminOperationStatusSchema>;

export const AdminOperationKindSchema = z.enum(["READ", "MUTATION"]);
export type AdminOperationKind = z.infer<typeof AdminOperationKindSchema>;

export const AdminAuthorizationModeSchema = z.enum(["GLOBAL_ONLY", "SUBJECT"]);
export type AdminAuthorizationMode = z.infer<typeof AdminAuthorizationModeSchema>;

const tokenSchema = z
  .string()
  .trim()
  .min(1)
  .max(128)
  .regex(/^[A-Za-z0-9][A-Za-z0-9._:-]*$/);

export const AdminOperationPolicySchema = z
  .object({
    version: z.number().int().positive(),
    requiresReason: z.boolean(),
    requiresExpectedRevision: z.boolean(),
    requiresSimulation: z.boolean(),
    requiresConfirmation: z.boolean(),
    requiredApprovals: z.number().int().min(0).max(2),
  })
  .strict();
export type AdminOperationPolicy = z.infer<typeof AdminOperationPolicySchema>;

export interface AdminTarget {
  readonly type: string;
  readonly id: string | null;
}

export interface AdminScope {
  readonly scopeType: AdminScopeType;
  readonly scopeId: string | null;
}

export interface AdminCapabilityGrant {
  readonly key: string;
  readonly riskTier: AdminRiskTier;
}

export interface AdminAuthorizationSnapshot {
  readonly principalId: string;
  readonly status: "ACTIVE" | "DISABLED";
  readonly capabilities: readonly AdminCapabilityGrant[];
  readonly scopes: readonly AdminScope[];
}

export const AdminMutationRequestSchema = z
  .object({
    principalId: z.string().uuid(),
    operationType: tokenSchema,
    input: z.record(z.string(), z.unknown()),
    reason: z.string().trim().min(1).max(2000).optional(),
    expectedRevision: z.coerce.bigint().nonnegative().optional(),
    idempotencyKey: z.string().trim().min(8).max(128),
    correlationId: z.string().uuid(),
  })
  .strict();
export type AdminMutationRequest = z.infer<typeof AdminMutationRequestSchema>;

export const AdminReadAuthorizationRequestSchema = z
  .object({
    principalId: z.string().uuid(),
    operationType: tokenSchema,
    input: z.record(z.string(), z.unknown()),
  })
  .strict();
export type AdminReadAuthorizationRequest = z.infer<typeof AdminReadAuthorizationRequestSchema>;

export const AdminRoleAssignInputSchema = z
  .object({
    principalId: z.string().uuid(),
    roleId: z.string().uuid(),
  })
  .strict();
export type AdminRoleAssignInput = z.infer<typeof AdminRoleAssignInputSchema>;

export interface AdminSimulationResult {
  readonly summary: Readonly<Record<string, unknown>>;
  readonly before: Readonly<Record<string, unknown>> | null;
  readonly after: Readonly<Record<string, unknown>> | null;
}

export interface AdminOperationRecord {
  readonly id: string;
  readonly principalId: string;
  readonly capabilityKey: string;
  readonly operationType: string;
  readonly targetType: string;
  readonly targetId: string | null;
  readonly riskTier: AdminRiskTier;
  readonly status: AdminOperationStatus;
  readonly reason: string | null;
  readonly expectedRevision: bigint | null;
  readonly idempotencyKey: string;
  readonly requestFingerprint: string;
  readonly input: Readonly<Record<string, unknown>>;
  readonly result: Readonly<Record<string, unknown>> | null;
  readonly correlationId: string;
  readonly policy: AdminOperationPolicy;
  readonly revision: bigint;
  readonly appliedAt: Date | null;
}

export interface AdminPreparedOperation {
  readonly operation: AdminOperationRecord;
  readonly replayed: boolean;
}
''',

          'src/modules/admin/errors.ts': r'''export const ADMIN_ERROR_CODES = {
  INVALID_INPUT: "ADMIN_INVALID_INPUT",
  OPERATION_NOT_REGISTERED: "ADMIN_OPERATION_NOT_REGISTERED",
  OPERATION_KIND_MISMATCH: "ADMIN_OPERATION_KIND_MISMATCH",
  PRINCIPAL_NOT_FOUND: "ADMIN_PRINCIPAL_NOT_FOUND",
  PRINCIPAL_DISABLED: "ADMIN_PRINCIPAL_DISABLED",
  AUTHORIZATION_DENIED: "ADMIN_AUTHORIZATION_DENIED",
  CAPABILITY_POLICY_DRIFT: "ADMIN_CAPABILITY_POLICY_DRIFT",
  REASON_REQUIRED: "ADMIN_REASON_REQUIRED",
  EXPECTED_REVISION_REQUIRED: "ADMIN_EXPECTED_REVISION_REQUIRED",
  IDEMPOTENCY_CONFLICT: "ADMIN_IDEMPOTENCY_CONFLICT",
  OPERATION_NOT_FOUND: "ADMIN_OPERATION_NOT_FOUND",
  INVALID_OPERATION_STATE: "ADMIN_INVALID_OPERATION_STATE",
  SELF_APPROVAL_FORBIDDEN: "ADMIN_SELF_APPROVAL_FORBIDDEN",
  REVISION_CONFLICT: "ADMIN_REVISION_CONFLICT",
  TARGET_NOT_FOUND: "ADMIN_TARGET_NOT_FOUND",
} as const;

export type AdminErrorCode = (typeof ADMIN_ERROR_CODES)[keyof typeof ADMIN_ERROR_CODES];

export class AdminError extends Error {
  public constructor(
    public readonly code: AdminErrorCode,
    message: string,
    public readonly details?: Readonly<Record<string, unknown>>,
  ) {
    super(message);
    this.name = "AdminError";
  }
}
