  ["inventory.adjust", 2],
  ["wallet.adjust", 2],
  ["reward.grant", 2],
  ["effect.apply", 2],
  ["effect.remove", 2],
  ["pokemon.create", 3],
  ["pokemon.edit.basic", 3],
  ["pokemon.edit.mechanics", 3],
  ["pokemon.moves.edit", 3],
  ["pokemon.training.edit", 3],
  ["pokemon.ability.edit", 3],
  ["pokemon.transfer", 3],
  ["pokemon.archive_remove", 3],
  ["pokemon.restore", 3],
  ["pokedex.correct", 3],
  ["encounter.force_close", 3],
  ["battle.force_cancel", 3],
  ["battle.correct_state", 3],
  ["content.draft.create", 3],
  ["content.draft.edit", 3],
  ["content.validate", 3],
  ["content.archive", 3],
  ["batch.preview", 2],
  ["batch.execute.low_risk", 3],
  ["player.reset.full", 4],
  ["content.publish", 4],
  ["content.rollback_release", 4],
  ["batch.execute.high_risk", 4],
  ["admin.role.assign", 4],
  ["admin.role.manage", 4],
  ["admin.capability.manage", 4],
  ["admin.override.invariant", 4],
] as const;

const roles: Record<string, readonly string[]> = {
  SUPPORT: [
    "player.read", "pokemon.read", "inventory.read", "economy.read", "progression.read",
    "pokedex.read", "world.read", "battle.read", "effects.read", "player.profile.edit",
    "player.location.correct", "player.onboarding.support", "pokemon.roster.manage",
    "encounter.support", "battle.support",
  ],
  GAME_MASTER: [
    "player.read", "pokemon.read", "inventory.read", "progression.read", "world.read",
    "battle.read", "effects.read", "encounter.support", "battle.support", "reward.grant",
    "effect.apply", "effect.remove",
  ],
  ECONOMY_ADMIN: [
    "player.read", "inventory.read", "economy.read", "progression.read", "inventory.adjust",
    "wallet.adjust", "progression.adjust", "progression.unlock.manage", "batch.preview",
    "batch.execute.low_risk",
  ],
  POKEMON_ADMIN: [
    "player.read", "pokemon.read", "pokemon.create", "pokemon.edit.basic",
    "pokemon.edit.mechanics", "pokemon.moves.edit", "pokemon.training.edit",
    "pokemon.ability.edit", "pokemon.roster.manage", "pokemon.transfer", "pokemon.archive_remove",
    "pokemon.restore", "pokedex.correct",
  ],
  CONTENT_EDITOR: ["content.draft.create", "content.draft.edit", "content.validate"],
  CONTENT_PUBLISHER: ["content.validate", "content.publish", "content.archive"],
  SENIOR_ADMIN: capabilities.filter(([, risk]) => risk <= 3).map(([key]) => key),
  OWNER_SECURITY_ADMIN: capabilities.map(([key]) => key),
};

const pool = new Pool({ connectionString: databaseUrl, max: 4 });
try {
  for (const [key, riskTier] of capabilities) {
    await pool.query(
      `INSERT INTO capabilities(id, key, risk_tier)
       VALUES ($1, $2, $3)
       ON CONFLICT (key) DO UPDATE
       SET risk_tier = EXCLUDED.risk_tier
       WHERE capabilities.risk_tier = EXCLUDED.risk_tier`,
      [randomUUID(), key, riskTier],
    );
    const persisted = await pool.query<{ risk_tier: number }>(
      `SELECT risk_tier FROM capabilities WHERE key = $1`,
      [key],
    );
    if (persisted.rows[0]?.risk_tier !== riskTier) {
      throw new Error(`Capability risk drift for ${key}`);
    }
  }

  for (const [slug, capabilityKeys] of Object.entries(roles)) {
    await pool.query(
      `INSERT INTO admin_roles(id, slug, name)
       VALUES ($1, $2, $3)
       ON CONFLICT (slug) DO NOTHING`,
      [randomUUID(), slug, slug.replaceAll("_", " ")],
    );
    const role = await pool.query<{ id: string }>(`SELECT id FROM admin_roles WHERE slug = $1`, [slug]);
    const roleId = role.rows[0]?.id;
    if (roleId === undefined) throw new Error(`Role missing after seed: ${slug}`);
    for (const capabilityKey of capabilityKeys) {
      await pool.query(
        `INSERT INTO admin_role_capabilities(role_id, capability_id)
         SELECT $1, capability.id FROM capabilities capability WHERE capability.key = $2
         ON CONFLICT DO NOTHING`,
        [roleId, capabilityKey],
      );
    }
  }
  console.log(`Phase 12 admin registry seed ready: ${capabilities.length} capabilities, ${Object.keys(roles).length} roles`);
} finally {
  await pool.end();
}
''',

          'db/proofs/phase12_admin_registry_e2e.ts': r'''import { randomUUID } from "node:crypto";
import { Pool } from "pg";
import { createPhase12AdminOperationRegistry } from "../../src/modules/admin/definitions.js";
import { ADMIN_ERROR_CODES, AdminError } from "../../src/modules/admin/errors.js";
import { AdminService } from "../../src/modules/admin/service.js";
import { PostgresAdminRepository } from "../../src/platform/admin/postgres-admin-repository.js";

const databaseUrl = process.env.DATABASE_URL;
if (databaseUrl === undefined) throw new Error("DATABASE_URL is required");

function expectAdminCode(error: unknown, code: string): void {
  if (!(error instanceof AdminError) || error.code !== code) {
    throw error instanceof Error ? error : new Error(`Expected ${code}`);
  }
}

const pool = new Pool({ connectionString: databaseUrl, max: 6 });
try {
  const ownerRole = await pool.query<{ id: string }>(`SELECT id FROM admin_roles WHERE slug = 'OWNER_SECURITY_ADMIN'`);
  const supportRole = await pool.query<{ id: string }>(`SELECT id FROM admin_roles WHERE slug = 'SUPPORT'`);
  const ownerRoleId = ownerRole.rows[0]?.id;
  const supportRoleId = supportRole.rows[0]?.id;
  if (ownerRoleId === undefined || supportRoleId === undefined) throw new Error("Phase 12 roles are not seeded");

  const proposerId = randomUUID();
  const approverId = randomUUID();
  const scopedSupportId = randomUUID();
  const targetAdminId = randomUUID();
  const staleTargetId = randomUUID();
  const allowedPlayerId = randomUUID();
  const otherPlayerId = randomUUID();

  for (const [id, identity] of [
    [proposerId, "proof:proposer"],
    [approverId, "proof:approver"],
    [scopedSupportId, "proof:scoped-support"],
    [targetAdminId, "proof:target"],
    [staleTargetId, "proof:stale-target"],
  ]) {
    await pool.query(
      `INSERT INTO admin_principals(id, identity_ref, status) VALUES ($1, $2, 'ACTIVE')`,
      [id, identity],
    );
  }
  for (const id of [proposerId, approverId]) {
    await pool.query(`INSERT INTO admin_principal_roles(principal_id, role_id) VALUES ($1, $2)`, [id, ownerRoleId]);
    await pool.query(
      `INSERT INTO admin_principal_scopes(id, principal_id, scope_type, scope_id)
       VALUES ($1, $2, 'GLOBAL', NULL)`,
      [randomUUID(), id],
    );
  }
  await pool.query(
    `INSERT INTO admin_principal_roles(principal_id, role_id) VALUES ($1, $2)`,
    [scopedSupportId, supportRoleId],
  );
  await pool.query(
    `INSERT INTO admin_principal_scopes(id, principal_id, scope_type, scope_id)
     VALUES ($1, $2, 'PLAYER', $3)`,
    [randomUUID(), scopedSupportId, allowedPlayerId],
  );

  const repository = new PostgresAdminRepository(pool);
  const service = new AdminService(createPhase12AdminOperationRegistry(repository), repository);

  const allowed = await service.authorizeRead({
    principalId: scopedSupportId,
    operationType: "player.read",
    input: { playerId: allowedPlayerId },
  });
  if (allowed.id !== allowedPlayerId) throw new Error("Player-scoped read did not resolve expected target");

  try {
    await service.authorizeRead({
      principalId: scopedSupportId,
      operationType: "player.read",
      input: { playerId: otherPlayerId },
    });
    throw new Error("BOLA scope bypass unexpectedly succeeded");
  } catch (error) {
    expectAdminCode(error, ADMIN_ERROR_CODES.AUTHORIZATION_DENIED);
  }

  try {
    await service.authorizeRead({
      principalId: scopedSupportId,
      operationType: "player.read",
      input: { playerId: allowedPlayerId, status: "ACTIVE" },
    });
    throw new Error("Mass-assignment input unexpectedly succeeded");
  } catch (error) {
    expectAdminCode(error, ADMIN_ERROR_CODES.INVALID_INPUT);
  }

  try {
    await service.prepareMutation({
      principalId: scopedSupportId,
      operationType: "admin.role.assign",
      input: { principalId: targetAdminId, roleId: supportRoleId },
      reason: "attempt unauthorized role assignment",
      expectedRevision: 0,
      idempotencyKey: "phase12-proof-unauthorized",
      correlationId: randomUUID(),
    });
    throw new Error("Unauthorized high-risk operation unexpectedly prepared");
  } catch (error) {
    expectAdminCode(error, ADMIN_ERROR_CODES.AUTHORIZATION_DENIED);
  }

  const idempotencyKey = "phase12-proof-role-assign-001";
  const correlationId = randomUUID();
  const request = {
    principalId: proposerId,
    operationType: "admin.role.assign",
    input: { principalId: targetAdminId, roleId: supportRoleId },
    reason: "grant support role for operational proof",
    expectedRevision: 0,
    idempotencyKey,
    correlationId,
  };
  const prepared = await service.prepareMutation(request);
  if (prepared.replayed || prepared.operation.status !== "VALIDATED") {
    throw new Error("High-risk operation was not prepared in VALIDATED state");
  }
  const replay = await service.prepareMutation(request);
  if (!replay.replayed || replay.operation.id !== prepared.operation.id) {
    throw new Error("Duplicate admin operation did not replay same semantic claim");
  }
  try {
    await service.prepareMutation({
      ...request,
      input: { principalId: staleTargetId, roleId: supportRoleId },
    });
    throw new Error("Idempotency fingerprint mismatch unexpectedly succeeded");
  } catch (error) {
    expectAdminCode(error, ADMIN_ERROR_CODES.IDEMPOTENCY_CONFLICT);
  }

  const simulated = await service.simulate(prepared.operation.id, proposerId);
  if (simulated.status !== "PENDING_CONFIRMATION") throw new Error("Simulation did not enter confirmation gate");
  const confirmed = await service.confirm(prepared.operation.id, proposerId);
  if (confirmed.status !== "PENDING_APPROVAL") throw new Error("Confirmation did not enter approval gate");
  try {
    await service.approve(prepared.operation.id, proposerId, "self approve");
    throw new Error("Self approval unexpectedly succeeded");
  } catch (error) {
    expectAdminCode(error, ADMIN_ERROR_CODES.SELF_APPROVAL_FORBIDDEN);
  }
  const approved = await service.approve(prepared.operation.id, approverId, "independent R4 approval");
  if (approved.status !== "READY") throw new Error("Independent approval did not make operation READY");
  const applied = await service.apply(prepared.operation.id, proposerId);
  if (applied.status !== "APPLIED") throw new Error("Role assignment did not apply");
  const appliedReplay = await service.apply(prepared.operation.id, proposerId);
  if (appliedReplay.id !== applied.id || appliedReplay.status !== "APPLIED") {
    throw new Error("Applied admin operation did not replay safely");
  }

  const targetState = await pool.query<{ revision: string; role_count: string }>(
    `SELECT principal.revision::text,
            count(relation.role_id)::text AS role_count
     FROM admin_principals principal
     LEFT JOIN admin_principal_roles relation
       ON relation.principal_id = principal.id AND relation.role_id = $2
     WHERE principal.id = $1
     GROUP BY principal.id`,
    [targetAdminId, supportRoleId],
  );
  if (targetState.rows[0]?.revision !== "1" || targetState.rows[0]?.role_count !== "1") {
    throw new Error(`Role assignment target state invalid: ${JSON.stringify(targetState.rows[0])}`);
  }
  const evidence = await pool.query<{ changes: string; audits: string; confirmations: string; approvals: string }>(
    `SELECT
       (SELECT count(*)::text FROM admin_operation_changes WHERE admin_operation_id = $1) AS changes,
       (SELECT count(*)::text FROM audit_events WHERE metadata->>'adminOperationId' = $1::text) AS audits,
       (SELECT count(*)::text FROM admin_operation_confirmations WHERE admin_operation_id = $1) AS confirmations,
       (SELECT count(*)::text FROM admin_operation_approvals WHERE admin_operation_id = $1 AND decision = 'APPROVED') AS approvals`,
    [prepared.operation.id],
  );
  const evidenceRow = evidence.rows[0];
  if (
    evidenceRow?.changes !== "1" ||
    evidenceRow.audits !== "1" ||
    evidenceRow.confirmations !== "1" ||
    evidenceRow.approvals !== "1"
  ) {
    throw new Error(`Admin evidence incomplete: ${JSON.stringify(evidenceRow)}`);
  }

  const stalePrepared = await service.prepareMutation({
    principalId: proposerId,
    operationType: "admin.role.assign",
    input: { principalId: staleTargetId, roleId: supportRoleId },
    reason: "stale revision proof",
    expectedRevision: 0,
    idempotencyKey: "phase12-proof-stale-001",
    correlationId: randomUUID(),
  });
  await service.simulate(stalePrepared.operation.id, proposerId);
  await service.confirm(stalePrepared.operation.id, proposerId);
  await service.approve(stalePrepared.operation.id, approverId, "approve stale proof before conflict");
  await pool.query(`UPDATE admin_principals SET revision = revision + 1 WHERE id = $1`, [staleTargetId]);
  try {
    await service.apply(stalePrepared.operation.id, proposerId);
    throw new Error("Stale admin operation unexpectedly overwrote concurrent state");
  } catch (error) {
    expectAdminCode(error, ADMIN_ERROR_CODES.REVISION_CONFLICT);
  }
  const staleAssignment = await pool.query(
    `SELECT 1 FROM admin_principal_roles WHERE principal_id = $1 AND role_id = $2`,
    [staleTargetId, supportRoleId],
  );
  if (staleAssignment.rowCount !== 0) throw new Error("Stale operation mutated target despite CAS conflict");

  console.log("Phase 12A admin registry proof complete: capability + object/property auth, R4 simulation/confirmation/dual approval, CAS, idempotency and append-only evidence verified");
} finally {
  await pool.end();
}
''',

          'tests/admin/operation-registry.test.ts': r'''import { describe, expect, it } from "vitest";
import { z } from "zod";
import { AdminError } from "../../src/modules/admin/errors.js";
import {
  AdminOperationRegistry,
  adminRequestFingerprint,
  defineAdminOperation,
} from "../../src/modules/admin/operation-registry.js";

const readDefinition = defineAdminOperation({
  kind: "READ",
  operationType: "player.read",
  capabilityKey: "player.read",
  riskTier: 0,
  authorizationMode: "SUBJECT",
  policy: {
    version: 1,
    requiresReason: false,
    requiresExpectedRevision: false,
    requiresSimulation: false,
    requiresConfirmation: false,
    requiredApprovals: 0,
  },
  inputSchema: z.object({ playerId: z.string().uuid() }).strict(),
  target: (input) => ({ type: "PLAYER", id: input.playerId }),
});

describe("AdminOperationRegistry", () => {
  it("rejects duplicate operation types", () => {
    const registry = new AdminOperationRegistry().register(readDefinition);
    expect(() => registry.register(readDefinition)).toThrow(AdminError);
  });

  it("uses strict schemas to reject mass assignment", () => {
    expect(() =>
      readDefinition.parseInput({
        playerId: "11111111-1111-4111-8111-111111111111",
        status: "ACTIVE",
      }),
    ).toThrow(AdminError);
  });

  it("fingerprints semantic input independent of object key order", () => {
    const principalId = "22222222-2222-4222-8222-222222222222";
    const target = { type: "PLAYER", id: "11111111-1111-4111-8111-111111111111" };
    const first = adminRequestFingerprint({
      principalId,
      definition: readDefinition,
      parsedInput: { playerId: target.id, nested: { b: 2, a: 1 } },
      target,
      reason: null,
      expectedRevision: null,
    });
    const second = adminRequestFingerprint({
      principalId,
      definition: readDefinition,
      parsedInput: { nested: { a: 1, b: 2 }, playerId: target.id },
      target,
      reason: null,
      expectedRevision: null,
    });
    expect(first).toBe(second);
  });

  it("refuses mutation gates on read definitions", () => {
    expect(() =>
      defineAdminOperation({
        kind: "READ",
        operationType: "bad.read",
        capabilityKey: "player.read",
        riskTier: 0,
        authorizationMode: "SUBJECT",
        policy: {
          version: 1,
          requiresReason: false,
          requiresExpectedRevision: false,
          requiresSimulation: false,
          requiresConfirmation: true,
          requiredApprovals: 0,
        },
        inputSchema: z.object({}).strict(),
        target: () => ({ type: "PLAYER", id: null }),
      }),
    ).toThrow(AdminError);
  });
});
''',

          '.github/workflows/admin-proof.yml': r'''name: Admin Proof

on:
  push:
    branches:
      - main
      - "gate/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: admin-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: authorization / registry / R4 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

