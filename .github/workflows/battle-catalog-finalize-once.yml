name: Battle Catalog Finalize Once

on:
  push:
    branches:
      - feat/battle-engine-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      DATABASE_POOL_MAX: 12
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      DATABASE_IDLE_TIMEOUT_MS: 30000
      DATABASE_QUERY_TIMEOUT_MS: 10000
      DATABASE_STATEMENT_TIMEOUT_MS: 10000
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: 15000
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/battle-engine-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test --tuples-only --command 'SELECT 1;' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1

      - name: Replace trigger magic with explicit catalog cloning
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path('db/migrations/0007_battle_resolution_integrity.sql')
          sql = migration.read_text()
          if sql.count('SET correlation_id = gen_random_uuid()') != 2:
              raise SystemExit('unexpected correlation backfill count')
          sql = sql.replace('SET correlation_id = gen_random_uuid()', 'SET correlation_id = id')
          start_marker = '-- Catalog clone code written before battle flags intentionally omits the new column.'
          end_marker = 'CREATE INDEX idx_battle_actions_battle_version'
          if start_marker not in sql or end_marker not in sql:
              raise SystemExit('battle flags trigger block anchors missing')
          start = sql.index(start_marker)
          end = sql.index(end_marker, start)
          sql = sql[:start] + '-- Move flags are cloned explicitly by PostgresCatalogRepository.\n' + sql[end:]
          if 'inherit_move_revision_battle_flags' in sql or 'trg_move_revisions_inherit_battle_flags' in sql:
              raise SystemExit('trigger residue remains')
          migration.write_text(sql)

          repo = Path('src/platform/catalog/postgres-catalog-repository.ts')
          text = repo.read_text()

          old_type = '''        effect_key: string | null;\n        effect_config: unknown;\n        active: boolean;\n      }>(\n        `SELECT move_id, type_id, category, power, accuracy, priority, max_pp,\n                effect_key, effect_config, active'''
          new_type = '''        effect_key: string | null;\n        effect_config: unknown;\n        flags: unknown;\n        active: boolean;\n      }>(\n        `SELECT move_id, type_id, category, power, accuracy, priority, max_pp,\n                effect_key, effect_config, flags, active'''
          if text.count(old_type) != 1:
              raise SystemExit('move query anchor mismatch')
          text = text.replace(old_type, new_type)

          old_map = '''        effectKey: entry.effect_key,\n        effectConfig: entry.effect_config,\n        active: entry.active,\n      })),\n      abilities:'''
          new_map = '''        effectKey: entry.effect_key,\n        effectConfig: entry.effect_config,\n        flags: entry.flags,\n        active: entry.active,\n      })),\n      abilities:'''
          if text.count(old_map) != 1:
              raise SystemExit('move mapping anchor mismatch')
          text = text.replace(old_map, new_map)

          old_clone = '''          "effect_key",\n          "effect_config",\n          "active",\n        ],\n      },\n      {\n        table: "ability_revisions",'''
          new_clone = '''          "effect_key",\n          "effect_config",\n          "flags",\n          "active",\n        ],\n      },\n      {\n        table: "ability_revisions",'''
          if text.count(old_clone) != 1:
              raise SystemExit('move clone anchor mismatch')
          text = text.replace(old_clone, new_clone)
          repo.write_text(text)
          PY

      - name: Apply canonical formatting
        run: pnpm format

      - name: Quality gates
        run: |
          set -euo pipefail
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test
          pnpm db:verify
          git diff --check

      - name: Remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/battle-format-once.yml
          rm -f .github/workflows/battle-catalog-finalize-once.yml

      - name: Commit permanent hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'battle: make move flag cloning explicit'
          git push origin HEAD:feat/battle-engine-v1
