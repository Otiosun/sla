name: WIP Phase 15 Autopatch

on:
  push:
    branches:
      - feat/phase15-gen123-import-wip

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase15-gen123-import-wip
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply reviewed Phase 15 corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "db/imports/gen123/model.ts",
              "  Gen123Source,\n",
              "  type Gen123Source,\n",
          )
          replace_exact(
              "db/imports/gen123/import.ts",
              "      row.forEach((value) => values.push(value));\n",
              "      for (const value of row) values.push(value);\n",
          )
          replace_exact(
              "db/imports/gen123/import.ts",
              '  if (existing.rows[0]?.status === "PUBLISHED") return existing.rows[0].id;\n',
              '  if (existing.rows[0] !== undefined && new Set(["VALIDATED", "PUBLISHED"]).has(existing.rows[0].status)) {\n    return existing.rows[0].id;\n  }\n',
          )
          replace_exact(
              "db/imports/gen123/import.ts",
              '  await client.query(\n    `UPDATE rulesets SET status = \'PUBLISHED\', published_at = now()\n     WHERE id = $1 AND status = \'VALIDATED\'`,\n    [id],\n  );\n',
              '',
          )
          replace_exact(
              "db/imports/gen123/import.ts",
              '  for (const [regionSource, speciesIds] of starterSpecies) speciesIds.forEach((speciesSource, index) => starters.push([gen123Id(`starter:${releaseId}:${regionSource}:${speciesSource}`), releaseId, ids.region.get(regionSource), ids.form.get(speciesSource), 5, index, true]));\n',
              '  for (const [regionSource, speciesIds] of starterSpecies) {\n    for (const [index, speciesSource] of speciesIds.entries()) {\n      starters.push([\n        gen123Id(`starter:${releaseId}:${regionSource}:${speciesSource}`),\n        releaseId,\n        ids.region.get(regionSource),\n        ids.form.get(speciesSource),\n        5,\n        index,\n        true,\n      ]);\n    }\n  }\n',
          )
          replace_exact(
              "db/proofs/phase15_gen123_import_e2e.ts",
              '  if(active.rows[0]?.content_release_id===releaseId) throw new Error("Phase 15 candidate unexpectedly replaced ACTIVE release");\n',
              '  if(active.rows[0]?.content_release_id===releaseId) throw new Error("Phase 15 candidate unexpectedly replaced ACTIVE release");\n  const candidateRuleset=await pool.query<{ status:string }>("SELECT ruleset.status FROM content_releases release JOIN rulesets ruleset ON ruleset.id=release.default_ruleset_id WHERE release.id=$1",[releaseId]);\n  if(candidateRuleset.rows[0]?.status!=="VALIDATED") throw new Error(`Candidate ruleset must stop at VALIDATED, got ${candidateRuleset.rows[0]?.status ?? "missing"}`);\n',
          )

          workflow = Path(".github/workflows/catalog-seed-proof.yml")
          text = workflow.read_text()
          marker = '          test "$seed_ok" = "ok"\n'
          if text.count(marker) != 1:
              raise SystemExit("catalog seed workflow marker changed")
          if "Phase 15 Gen I-III import proof" not in text:
              addition = '''\n\n      - name: Checkout pinned PokeAPI data snapshot\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n        with:\n          repository: PokeAPI/pokeapi\n          ref: 7af36d9f3424366ffc46e90d94c8bc120df39cd0\n          path: .phase15-pokeapi\n          sparse-checkout: data/v2/csv\n          sparse-checkout-cone-mode: false\n          fetch-depth: 1\n\n      - name: Phase 15 Gen I-III import proof\n        env:\n          POKEAPI_DATA_DIR: ${{ github.workspace }}/.phase15-pokeapi/data/v2/csv\n        run: pnpm tsx db/proofs/phase15_gen123_import_e2e.ts\n'''
              workflow.write_text(text.replace(marker, marker + addition))
          PY
      - name: Apply canonical Biome fixes and format
        run: pnpm exec biome check --write --unsafe db/imports/gen123 db/proofs/phase15_gen123_import_e2e.ts
      - name: Commit corrected tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/imports/gen123 db/proofs/phase15_gen123_import_e2e.ts .github/workflows/catalog-seed-proof.yml
          git commit -m "wip: harden Phase 15 importer and proof"
          git push origin HEAD:feat/phase15-gen123-import-wip
