name: WIP Biome Format Oracle

on:
  push:
    branches:
      - gate/phase17-postdeploy-smoke-prereq-v1

permissions:
  contents: write

concurrency:
  group: wip-biome-format-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    name: exact Biome 2.5.10 formatter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply exact formatter output
        run: |
          set -euo pipefail
          pnpm exec biome format --write \
            src/operations/post-deploy-application-smoke.ts \
            scripts/operations/post-deploy-application-smoke.ts \
            db/proofs/phase17_application_smoke_e2e.ts

      - name: Commit formatter output when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/operations/post-deploy-application-smoke.ts \
            scripts/operations/post-deploy-application-smoke.ts \
            db/proofs/phase17_application_smoke_e2e.ts; then
            echo "Biome output already exact."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/operations/post-deploy-application-smoke.ts \
            scripts/operations/post-deploy-application-smoke.ts \
            db/proofs/phase17_application_smoke_e2e.ts
          git commit -m "Apply exact Biome 2.5.10 formatter output"
          git push origin "HEAD:${GITHUB_REF_NAME}"
