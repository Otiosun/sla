name: Hub web validation bridge

on:
  push:
    branches:
      - gate/hub-web-validation-v1

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout Hub web exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Otiosun/pokemon-hub-web
          ref: f4645117ae4b2259cdcb2794826eb83339e5dcfe
          path: hub
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: hub/.node-version
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install Hub dependencies
        working-directory: hub
        run: pnpm install --frozen-lockfile

      - name: Typecheck Hub
        working-directory: hub
        run: timeout 120s pnpm typecheck

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout Hub web exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Otiosun/pokemon-hub-web
          ref: f4645117ae4b2259cdcb2794826eb83339e5dcfe
          path: hub
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: hub/.node-version
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install Hub dependencies
        working-directory: hub
        run: pnpm install --frozen-lockfile

      - name: Run Hub tests
        working-directory: hub
        run: timeout 180s pnpm test:run --reporter=verbose
