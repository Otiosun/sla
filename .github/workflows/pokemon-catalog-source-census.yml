name: Pokemon Catalog Source Census (draft, no publish)

on:
  push:
    branches:
      - feat/pokemon-management-stage2-20261027
    paths:
      - .github/workflows/pokemon-catalog-source-census.yml
      - docs/catalog/**
      - scripts/catalog/**
      - src/modules/catalog/versioned-learnset-source.ts
      - src/modules/catalog/stage2-source-proposal-audit.ts
      - src/modules/catalog/versioned-evolution-chain.ts
      - src/modules/catalog/move-mechanics-review.ts
      - db/proofs/stage2_release_publication_audit.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokemon-source-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-census:
    name: Compare official sources to disposable release (no publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokemon_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_rpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout draft only
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch pinned source methods and machine references
        run: |
          node --import tsx scripts/catalog/build-versioned-move-proposal.ts \
            docs/catalog/pokemon-beyond-move-sources.json \
            build/catalog/move-proposal.json
      - name: Validate source completeness and per-generation TM mapping
        run: |
          node --import tsx scripts/catalog/validate-versioned-move-proposal.ts \
            docs/catalog/pokemon-beyond-move-sources.json \
            build/catalog/move-proposal.json
      - name: Build disposable catalog snapshot
        run: |
          pnpm db:migrate
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:seed:phase11
          pnpm db:seed:phase12
      - name: Record concrete source-to-release publication gaps
        run: |
          node --import tsx db/proofs/stage2_release_publication_audit.ts \
            --proposal build/catalog/move-proposal.json \
            --output build/catalog/release-source-gaps.json
      - name: Upload source hashes and missing-content report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-draft-content-source-census
          path: |
            build/catalog/move-proposal.json
            build/catalog/release-source-gaps.json
          if-no-files-found: warn
          retention-days: 14
