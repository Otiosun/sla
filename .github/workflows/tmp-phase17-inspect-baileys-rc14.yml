name: Temporary Phase 17 inspect Baileys rc14

on:
  push:
    branches:
      - fix/phase17-baileys-pairing-compat-v1
    paths:
      - .github/workflows/tmp-phase17-inspect-baileys-rc14.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/phase17-baileys-pairing-compat-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Inspect exact compiled patch anchors
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          let dir = path.dirname(require.resolve('@whiskeysockets/baileys'))
          while (true) {
            const manifest = path.join(dir, 'package.json')
            if (fs.existsSync(manifest) && JSON.parse(fs.readFileSync(manifest, 'utf8')).name === '@whiskeysockets/baileys') break
            const parent = path.dirname(dir)
            if (parent === dir) throw new Error('Baileys package root not found')
            dir = parent
          }

          function printRange(relative, start, end) {
            const lines = fs.readFileSync(path.join(dir, relative), 'utf8').split(/\r?\n/)
            console.log(`\n===== ${relative}:${start}-${end} =====`)
            for (let i = start - 1; i < Math.min(end, lines.length); i += 1) console.log(`${i + 1}: ${lines[i]}`)
          }

          const companion = fs.readFileSync(path.join(dir, 'lib/Utils/companion-reg-client-utils.js'), 'utf8').split(/\r?\n/)
          console.log('\n===== lib/Utils/companion-reg-client-utils.js FULL =====')
          companion.forEach((line, index) => console.log(`${index + 1}: ${line}`))

          const socket = fs.readFileSync(path.join(dir, 'lib/Socket/socket.js'), 'utf8').split(/\r?\n/)
          for (const needle of ['pair-device', 'qrTimer', 'buildPairingQRData', 'pair-success', 'ws.on', 'ws.off']) {
            const indexes = socket.flatMap((line, index) => line.includes(needle) ? [index] : [])
            console.log(`\n===== socket needle ${needle} occurrences=${indexes.length} =====`)
            for (const index of indexes.slice(0, 8)) {
              const start = Math.max(0, index - 18)
              const end = Math.min(socket.length, index + 28)
              for (let i = start; i < end; i += 1) console.log(`${i + 1}: ${socket[i]}`)
            }
          }

          printRange('lib/Socket/messages-recv.js', 354, 368)
          const utilsIndex = fs.readFileSync(path.join(dir, 'lib/Utils/index.js'), 'utf8').split(/\r?\n/)
          console.log('\n===== Utils index companion export =====')
          utilsIndex.forEach((line, index) => {
            if (line.includes('companion-reg-client-utils')) console.log(`${index + 1}: ${line}`)
          })
          NODE
