name: CI

on:
  push:
    branches:
      - main
      - "infra/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "migration/**"
      - "hardening/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile (bootstrap only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already versioned; nothing to commit."
            exit 0
          fi
          git commit -m "build: lock exact dependency graph"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine

          for attempt in {1..30}; do
            if docker exec pokemon-postgres pg_isready -U pokemon -d pokemon_rpg_test; then
              exit 0
            fi
            sleep 1
          done

          docker logs pokemon-postgres
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
