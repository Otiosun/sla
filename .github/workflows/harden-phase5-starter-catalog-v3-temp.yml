name: Temporary Phase 5 Starter Catalog Hardening V3

on:
  push:
    branches:
      - feat/player-onboarding-starter-v1

permissions:
  contents: write

env:
  APP_ENV: test
  LOG_LEVEL: warn
  DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
  MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres-phase5-hardening \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2

          for attempt in {1..30}; do
            if docker exec pokemon-postgres-phase5-hardening psql \
              --username pokemon \
              --dbname pokemon_rpg_test \
              --set ON_ERROR_STOP=1 \
              --tuples-only \
              --command "SELECT 1;" >/dev/null 2>&1; then
              echo "PostgreSQL target database is ready."
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres-phase5-hardening
          exit 1

      - name: Stage starter catalog hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase5_starter_catalog_hardening_temp.py')
          text = path.read_text()
          old = '      ),\\1"""'
          new = '      ),\\\\1"""'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one unsafe backreference, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python scripts/phase5_starter_catalog_hardening_temp.py

      - name: Apply canonical Biome formatting
        run: >-
          pnpm exec biome check --write --unsafe
          src/modules/catalog/contracts.ts
          src/modules/catalog/fingerprint.ts
          src/modules/catalog/diff.ts
          src/modules/catalog/validation.ts
          src/platform/catalog/postgres-catalog-repository.ts
          tests/catalog/catalog-contracts.test.ts
          tests/db/player-onboarding.integration.test.ts

      - name: Validate hardening before commit
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/catalog src/platform/catalog/postgres-catalog-repository.ts tests/catalog/catalog-contracts.test.ts tests/db/player-onboarding.integration.test.ts
          if git diff --cached --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git commit -m "hardening(catalog): version starter options end to end"
          git push origin "HEAD:${GITHUB_REF_NAME}"
