name: Phase 12.16 Format Temp

on:
  push:
    branches:
      - work/phase12-16-patch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/phase12-16-patch

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format lifecycle proof only
        run: pnpm exec biome format --write db/proofs/phase12_pokemon_lifecycle_admin_e2e.ts

      - name: Commit format if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- db/proofs/phase12_pokemon_lifecycle_admin_e2e.ts; then
            echo "Proof already formatted"
            exit 0
          fi
          git config user.name "phase12-format"
          git config user.email "phase12-format@users.noreply.github.com"
          git add db/proofs/phase12_pokemon_lifecycle_admin_e2e.ts
          git commit -m "chore: format Phase 12.16 lifecycle proof"
          git push origin HEAD:work/phase12-16-patch
