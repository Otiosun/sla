name: Temporary Phase 5 Formatter

on:
  push:
    branches:
      - feat/player-onboarding-starter-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Biome fixes
        run: >-
          pnpm exec biome check --write --unsafe
          src/modules/player
          src/platform/player
          tests/player
          tests/db/player-onboarding.integration.test.ts
          db/seeds/phase5_player_slice.ts

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/player src/platform/player tests/player tests/db/player-onboarding.integration.test.ts db/seeds/phase5_player_slice.ts
          if git diff --cached --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git commit -m "style(player): apply canonical biome formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
