name: Phase 11 Unlock Reconcile Temp

on:
  push:
    branches:
      - work/phase11-trainer-unlock-reconcile-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/phase11-trainer-unlock-reconcile-v1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconcile already-satisfied trainer unlocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/platform/progression/postgres-progression-repository.ts')
          text = p.read_text()
          old = '      if (unlock.level <= row.level || unlock.level > afterLevel) continue;'
          new = '      if (unlock.level > afterLevel) continue;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one unlock gate, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          pnpm exec biome check --write src/platform/progression/postgres-progression-repository.ts
          pnpm typecheck
          pnpm exec vitest run tests/progression
      - name: Commit validated reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/progression/postgres-progression-repository.ts
          git commit -m "fix: reconcile satisfied trainer unlocks"
          git push origin HEAD:work/phase11-trainer-unlock-reconcile-v1
