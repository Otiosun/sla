name: Phase 12C Progression Adjust Temp

on:
  push:
    branches:
      - feat/phase12c-domain-admin-operations-v1

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase12c-domain-admin-operations-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - name: Apply staged progression patch
        run: |
          sed -i 's/Phase 12C domain admin proof complete:/Phase 12C economy admin proof complete:/' scripts/phase12c_progression_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/phase12c_progression_patch.py')
          t = p.read_text()
          t = t.replace(
              'const underflow = await admin.prepareMutation({\n    principalId,\n    operationType: "progression.trainer.adjust",',
              'const trainerUnderflow = await admin.prepareMutation({\n    principalId,\n    operationType: "progression.trainer.adjust",',
          )
          t = t.replace('admin.apply(underflow.operation.id, principalId)', 'admin.apply(trainerUnderflow.operation.id, principalId)')
          t = t.replace('[underflow.operation.id],', '[trainerUnderflow.operation.id],')
          p.write_text(t)
          PY
          python scripts/phase12c_progression_patch.py
      - run: pnpm exec biome format --write db/migrations/0013_domain_admin_operation_integrity.sql src/modules/progression/contracts.ts src/modules/progression/errors.ts src/modules/progression/ports.ts src/modules/progression/service.ts src/platform/progression/postgres-progression-repository.ts src/modules/admin/domain-contracts.ts src/modules/admin/domain-ports.ts src/modules/admin/domain-definitions.ts src/modules/admin/domain-service.ts db/proofs/phase12_domain_admin_e2e.ts .github/workflows/admin-proof.yml
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name pokemon-postgres \
            --env POSTGRES_USER=pokemon --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test --set ON_ERROR_STOP=1 --tuples-only --command "SELECT 1;" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm exec vitest run tests/progression tests/admin tests/economy
      - name: Verify existing Admin slices
        run: |
          pnpm db:seed:phase12
          node --import tsx db/proofs/phase12_admin_registry_e2e.ts
          node --import tsx db/proofs/phase12_player360_e2e.ts
      - name: Verify trainer progression domain operation
        run: |
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:seed:phase11
          node --import tsx db/proofs/phase12_domain_admin_e2e.ts
      - name: Commit validated progression adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/migrations/0013_domain_admin_operation_integrity.sql src/modules/progression/contracts.ts src/modules/progression/errors.ts src/modules/progression/ports.ts src/modules/progression/service.ts src/platform/progression/postgres-progression-repository.ts src/modules/admin/domain-contracts.ts src/modules/admin/domain-ports.ts src/modules/admin/domain-definitions.ts src/modules/admin/domain-service.ts db/proofs/phase12_domain_admin_e2e.ts .github/workflows/admin-proof.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add trainer progression admin adjustment'
          git push origin HEAD:feat/phase12c-domain-admin-operations-v1
