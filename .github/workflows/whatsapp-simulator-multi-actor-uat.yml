name: WhatsApp Simulator Multi-Actor UAT

on:
  push:
    branches:
      - "gate/whatsapp-simulator-v1"
  pull_request:
    branches:
      - "integration/player-flow-zhoulia-final"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-multi-actor-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uat:
    name: players / admins / world / PVE / PVP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      BELL_WORLD_TIME_OF_DAY: DAY
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test \
              --set ON_ERROR_STOP=1 --tuples-only --command "SELECT 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed playable Zhoulia stack
        run: |
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:seed:phase11
          pnpm db:seed:phase12
          pnpm ops:seed:whatsapp-simulator-fixture

      - name: Run autonomous multi-actor UAT
        run: pnpm uat:whatsapp:multi

      - name: Run deep gameplay UAT
        run: pnpm uat:whatsapp:deep

      - name: Run stress swarm UAT
        run: pnpm uat:whatsapp:stress


  gen123-fidelity:
    name: Gen I-III mechanics / Zhoulia-only world
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_gen123_sim_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_gen123_sim_test
      BELL_WORLD_TIME_OF_DAY: DAY
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout pinned PokeAPI data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PokeAPI/pokeapi
          ref: 7af36d9f3424366ffc46e90d94c8bc120df39cd0
          path: .sim-pokeapi
          sparse-checkout: data/v2/csv
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Verify pinned PokeAPI source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .sim-pokeapi rev-parse HEAD)" = "7af36d9f3424366ffc46e90d94c8bc120df39cd0"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach             --name pokemon-gen123-simulator-postgres             --env POSTGRES_USER=pokemon             --env POSTGRES_PASSWORD=test-only-password             --env POSTGRES_DB=pokemon_rpg_gen123_sim_test             --publish 5432:5432             postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-gen123-simulator-postgres psql               --username pokemon               --dbname pokemon_rpg_gen123_sim_test               --set ON_ERROR_STOP=1               --tuples-only               --command "SELECT 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-gen123-simulator-postgres
          exit 1

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed mechanics baseline without generic Zhoulia wild fixtures
        run: |
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase11
          pnpm db:seed:phase12

      - name: Build Gen I-III mechanics + Zhoulia-only simulator release
        env:
          POKEAPI_DATA_DIR: ${{ github.workspace }}/.sim-pokeapi/data/v2/csv
        run: pnpm ops:prepare:whatsapp-simulator-gen123

      - name: Seed simulator actors and groups
        run: pnpm ops:seed:whatsapp-simulator-fixture

      - name: Verify local-stability invariants on high-fidelity content
        env:
          DATABASE_URL: ""
          SIMULATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_gen123_sim_test
          POKEAPI_DATA_DIR: ${{ github.workspace }}/.sim-pokeapi/data/v2/csv
        run: pnpm ops:verify:whatsapp-simulator-local

      - name: Run multi-actor UAT on high-fidelity content
        run: pnpm uat:whatsapp:multi

      - name: Run deep gameplay UAT on high-fidelity content
        run: pnpm uat:whatsapp:deep

      - name: Run stress swarm UAT on high-fidelity content
        run: pnpm uat:whatsapp:stress
