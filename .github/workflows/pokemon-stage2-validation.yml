name: Pokemon Management Stage 2 (isolated draft)

on:
  push:
    branches:
      - feat/pokemon-management-stage2-20261027

permissions:
  contents: read

concurrency:
  group: pokemon-stage2-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated Stage 2 branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Focused service unit tests
        run: pnpm exec vitest run tests/player/player-portal-evolution-service.test.ts tests/player/player-portal-http-handler.test.ts tests/player/player-portal-move-choice-service.test.ts tests/player/player-portal-roster-service.test.ts tests/world-services/whatsapp-handlers.test.ts tests/progression/whatsapp-evolution-ambiguity.test.ts
      - name: Build runtime
        run: pnpm build

  postgres-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokemon_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_rpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      POSTGRES_INTEGRATION_TEST_URL: postgresql://pokemon:test-only-password@localhost:5432/postgres
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout isolated Stage 2 branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate and verify disposable PostgreSQL
        run: |
          pnpm db:migrate
          pnpm db:verify
      - name: Simulate Team/Box atomic swap, last-team-member, duplicates and move choices
        run: |
          pnpm exec vitest run \
            tests/db/hub-pc-storage-move.integration.test.ts \
            tests/db/roster-placement-30-slot-boxes.integration.test.ts \
            tests/db/pending-move-choice-duplicate.integration.test.ts \
            tests/db/player-portal-read-repository.integration.test.ts

  player-journey-whatsapp:
    name: synthetic trainer / real messaging / real Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokemon_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_rpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      BELL_WORLD_TIME_OF_DAY: DAY
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      POSTGRES_INTEGRATION_TEST_URL: postgresql://pokemon:test-only-password@localhost:5432/postgres
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout isolated Stage 2 branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate and seed actual synthetic Zhoulia
        run: |
          pnpm db:migrate
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:seed:phase11
          pnpm db:seed:phase12
          pnpm ops:seed:whatsapp-simulator-fixture
      # The legacy multi-actor UAT is tracked separately: its registration
      # sequence currently leaves players unapproved. This dedicated Stage 2
      # journey uses the real isolated UAT bootstrap, not a production shortcut.
      - name: Trainer journey /pokemon /golpes /aprender /evolucao /evoluir /pc
        run: node --import tsx db/proofs/whatsapp_simulator_pokemon_management_journey_uat.ts
