name: Publish Hub RC Image

on:
  push:
    branches:
      - gate/hub-profile-customization-v1

permissions:
  contents: read
  packages: write

concurrency:
  group: hub-rc-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: immutable Hub RC OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image coordinates
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${image}:hub-rc-sha-${GITHUB_SHA}"
          echo "RUNTIME_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Bootstrap Buildx
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish immutable RC image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$RUNTIME_IMAGE_TAG" \
            --push \
            .

      - name: Verify published image
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$RUNTIME_IMAGE_TAG" | awk '/^Digest:/ { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          printf 'published %s@%s\n' "$RUNTIME_IMAGE" "$digest"

      - name: Log out
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
