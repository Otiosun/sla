name: Exploration V4 Read-Only Router Proof

on:
  pull_request:
    branches:
      - fix/exploration-published-outcome-invariants-20261031
    paths:
      - ".github/workflows/exploration-v4-readonly-router-proof.yml"
      - "src/modules/exploration/expedition-v4-readonly-whatsapp.ts"
      - "src/platform/exploration/postgres-expedition-v4-status-reader.ts"
      - "src/runtime/compose-whatsapp-runtime.ts"
      - "src/runtime/compose-simulated-whatsapp-runtime.ts"
      - "tests/exploration/expedition-v4-readonly-whatsapp.test.ts"

permissions:
  contents: read

jobs:
  readonly-route:
    name: Bot read-only Rotom integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      NODE_ENV: test
      WHATSAPP_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: |
          npm install --global pnpm@11.23.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Confirm synthetic-only environment
        run: |
          test "$APP_ENV" = test
          test "$WHATSAPP_ENABLED" = false
          test ! -e .env
          test ! -e .env.local
          test ! -d auth_info_baileys
      - name: Format five changed source files
        run: |
          pnpm exec biome format --write src/modules/exploration/expedition-v4-readonly-whatsapp.ts src/platform/exploration/postgres-expedition-v4-status-reader.ts src/runtime/compose-whatsapp-runtime.ts src/runtime/compose-simulated-whatsapp-runtime.ts tests/exploration/expedition-v4-readonly-whatsapp.test.ts
      - name: Compile and prove read-only router
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run tests/exploration/expedition-v4-readonly-whatsapp.test.ts tests/exploration/expedition-incidental-incoming-admission.test.ts tests/exploration/expedition-incidental-game-group-admission.test.ts tests/messaging/runtime-command-policy-gate.test.ts
      - name: Build candidate without release
        run: pnpm build
      - name: Export normalized candidate files for exact review
        run: |
          for source in \
            src/modules/exploration/expedition-v4-readonly-whatsapp.ts \
            src/platform/exploration/postgres-expedition-v4-status-reader.ts \
            tests/exploration/expedition-v4-readonly-whatsapp.test.ts; do
            echo "PB_FORMAT_BEGIN:$source"
            base64 -w0 "$source"
            echo
            echo "PB_FORMAT_END:$source"
          done
