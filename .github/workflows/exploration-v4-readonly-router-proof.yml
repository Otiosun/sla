permissions:
  contents: read

jobs:
  readonly-route:
    name: Bot read-only Rotom integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      NODE_ENV: test
      WHATSAPP_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: |
          npm install --global pnpm@11.23.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Confirm synthetic-only environment
        run: |
          test "$APP_ENV" = test
          test "$WHATSAPP_ENABLED" = false
          test ! -e .env
          test ! -e .env.local
          test ! -d auth_info_baileys
      - name: Format all changed source files
        run: |
          pnpm exec biome format src/modules/community/runtime-command-policy-gate.ts src/modules/messaging/router.ts tests/messaging/runtime-command-policy-gate.test.ts tests/messaging/command-router-policy.test.ts src/modules/pvp/ports.ts src/modules/pvp/whatsapp-handlers.ts src/platform/pvp/postgres-pvp-challenge-repository.ts tests/messaging/pvp-whatsapp-resume.test.ts tests/db/pvp-challenge-repository.integration.test.ts src/modules/battle/pve-scene-whatsapp.ts src/modules/messaging/operational-ux-handlers.ts tests/battle/pve-scene-whatsapp.test.ts tests/messaging/operational-ux-handlers.test.ts src/platform/exploration/postgres-expedition-offline-actionable-menu-issuer.ts tests/exploration/expedition-offline-actionable-menu-issuer.test.ts src/platform/exploration/postgres-expedition-battle-eligibility.ts src/platform/exploration/postgres-expedition-offline-battle-start.ts src/platform/battle/postgres-battle-repository.ts tests/exploration/expedition-battle-eligibility.test.ts tests/exploration/expedition-offline-battle-start.test.ts src/modules/exploration/expedition-capture-confirmation.ts src/platform/exploration/postgres-expedition-capture-confirmation-recovery.ts tests/exploration/expedition-capture-confirmation-recovery.test.ts tests/exploration/expedition-canonical-capture-real-service-staging.test.ts src/modules/exploration/expedition-canonical-choice-staging.ts tests/exploration/expedition-canonical-choice-staging.test.ts src/platform/exploration/postgres-expedition-readonly-menu-issuer.ts src/platform/exploration/postgres-expedition-repository.ts src/platform/exploration/postgres-expedition-ignore-confirmation-recovery.ts tests/exploration/expedition-ignore-confirmation-recovery.test.ts src/modules/exploration/expedition-v4-incidental-panel.ts src/modules/exploration/expedition-incidental-ignore-staging.ts tests/exploration/expedition-v4-incidental-panel.test.ts src/platform/exploration/postgres-expedition-issued-menu-reply-proof.ts tests/exploration/expedition-issued-menu-reply-proof.test.ts src/modules/exploration/expedition-quoted-reply-readonly-staging.ts tests/exploration/expedition-quoted-reply-readonly-staging.test.ts src/platform/exploration/postgres-expedition-quoted-encounter-proof.ts tests/exploration/expedition-quoted-encounter-proof.test.ts src/modules/messaging/service.ts src/modules/messaging/ports.ts src/platform/messaging/postgres-messaging-repository.ts src/modules/exploration/expedition-search-post-sent-hook.ts src/platform/exploration/postgres-expedition-post-sent-recovery.ts tests/exploration/expedition-search-post-sent-worker.test.ts src/platform/exploration/postgres-expedition-search-sent-proof.ts src/modules/exploration/expedition-search-engagement-after-sent.ts tests/exploration/expedition-search-sent-proof.test.ts tests/exploration/expedition-search-engagement-after-sent.test.ts src/platform/exploration/postgres-expedition-search-encounter-preview.ts src/modules/exploration/expedition-v4-search-result-panel.ts tests/exploration/expedition-search-encounter-preview.test.ts tests/exploration/expedition-v4-search-result-panel.test.ts src/platform/exploration/postgres-expedition-v4-search.ts src/modules/exploration/expedition-v4-readonly-whatsapp.ts src/platform/exploration/postgres-expedition-v4-status-reader.ts src/runtime/compose-whatsapp-runtime.ts src/runtime/compose-simulated-whatsapp-runtime.ts tests/exploration/expedition-v4-readonly-whatsapp.test.ts tests/messaging/exploration-v4-readonly-runtime-composition.test.ts tests/db/solo-expedition-repository.integration.test.ts
      - name: Compile and prove read-only router
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run tests/messaging/runtime-command-policy-gate.test.ts tests/messaging/command-router-policy.test.ts tests/messaging/pvp-whatsapp-resume.test.ts tests/messaging/pvp-whatsapp.test.ts tests/battle/pve-scene-whatsapp.test.ts tests/messaging/operational-ux-handlers.test.ts tests/exploration/expedition-offline-actionable-menu-issuer.test.ts tests/exploration/expedition-battle-eligibility.test.ts tests/exploration/expedition-offline-battle-start.test.ts tests/exploration/expedition-ignore-confirmation-recovery.test.ts tests/exploration/expedition-v4-incidental-panel.test.ts tests/exploration/expedition-capture-confirmation-recovery.test.ts tests/exploration/expedition-canonical-capture-real-service-staging.test.ts tests/exploration/expedition-canonical-choice-staging.test.ts tests/exploration/expedition-issued-menu-reply-proof.test.ts tests/exploration/expedition-quoted-reply-readonly-staging.test.ts tests/exploration/expedition-quoted-encounter-proof.test.ts tests/exploration/expedition-search-post-sent-worker.test.ts tests/exploration/expedition-search-sent-proof.test.ts tests/exploration/expedition-search-engagement-after-sent.test.ts tests/exploration/expedition-search-encounter-preview.test.ts tests/exploration/expedition-v4-search-result-panel.test.ts tests/exploration/expedition-v4-readonly-whatsapp.test.ts tests/messaging/exploration-v4-readonly-runtime-composition.test.ts tests/exploration/expedition-incidental-incoming-admission.test.ts tests/exploration/expedition-incidental-game-group-admission.test.ts tests/messaging/runtime-command-policy-gate.test.ts
      - name: Build candidate without release
        run: pnpm build

  readonly-postgres:
    name: PostgreSQL 18 real V4 status isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      NODE_ENV: test
      WHATSAPP_ENABLED: "false"
      DATABASE_URL: postgresql://pokemon:test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: |
          npm install --global pnpm@11.23.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject external or production database
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL);if(u.hostname!=='127.0.0.1'||u.port!=='5432'||u.pathname!=='/postgres'||process.env.APP_ENV!=='test'||process.env.WHATSAPP_ENABLED!=='false')process.exit(1)"
      - name: Prove real PostgreSQL V4 status and no writes
        run: pnpm exec vitest run tests/db/solo-expedition-repository.integration.test.ts tests/db/pvp-challenge-repository.integration.test.ts
