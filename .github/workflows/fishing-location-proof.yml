name: Fishing Location Proof

on:
  pull_request:
    branches:
      - fix/uat-registration-profession-20261030
    paths:
      - "src/modules/world-services/fishing-renderer.ts"
      - "tests/messaging/world-services-fishing.test.ts"
      - ".github/workflows/fishing-location-proof.yml"

permissions:
  contents: read

jobs:
  fishing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/messaging/world-services-fishing.test.ts tests/world-services/fishing-service.test.ts
