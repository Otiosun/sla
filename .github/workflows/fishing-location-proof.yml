name: Fishing Location Proof

on:
  pull_request:
    branches:
      - fix/uat-registration-profession-20261030
    paths:
      - "src/modules/world-services/fishing-renderer.ts"
      - "tests/messaging/world-services-fishing.test.ts"
      - ".github/workflows/fishing-location-proof.yml"

permissions:
  contents: read

jobs:
  fishing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/messaging/world-services-fishing.test.ts tests/world-services/fishing-service.test.ts

  fishing-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokemon_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_rpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      NODE_ENV: test
      WHATSAPP_ENABLED: "false"
      DATABASE_URL: postgresql://pokemon:test-only-password@127.0.0.1:5432/pokemon_rpg_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify disposable DB target
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL);if(u.hostname!=='127.0.0.1'||u.port!=='5432'||u.pathname!=='/pokemon_rpg_test'||process.env.APP_ENV!=='test')process.exit(1)"
      - name: Fishing repository concurrency and idempotency
        run: pnpm exec vitest run tests/db/world-service-fishing-attempt-repository.integration.test.ts
