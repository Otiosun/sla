name: WIP Runtime Health Proof

on:
  push:
    branches:
      - "gate/phase17-runtime-health-fly-v1"

permissions:
  contents: read

concurrency:
  group: wip-runtime-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: PostgreSQL runtime health evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROOF_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres-runtime-health \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=runtime_health_proof \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres-runtime-health psql --username pokemon --dbname runtime_health_proof --command "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres-runtime-health
          exit 1

      - name: Bootstrap separated roles
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i \
            --env PGPASSWORD=test-only-password \
            pokemon-postgres-runtime-health psql \
            --host 127.0.0.1 \
            --username pokemon \
            --dbname runtime_health_proof \
            --set ON_ERROR_STOP=1 \
            --set migrator_role=pokemon_health_migrator \
            --set migrator_password=health-migrator-password \
            --set runtime_role=pokemon_health_runtime \
            --set runtime_password=health-runtime-password \
            < db/bootstrap/roles.sql

      - name: Apply migrations and runtime grants
        shell: bash
        env:
          APP_ENV: staging
          DATABASE_URL: postgresql://pokemon_health_runtime:health-runtime-password@localhost:5432/runtime_health_proof
          MIGRATOR_DATABASE_URL: postgresql://pokemon_health_migrator:health-migrator-password@localhost:5432/runtime_health_proof
        run: |
          set -euo pipefail
          DEPLOY_REVISION="$PROOF_REVISION" bash scripts/operations/release-migrate.sh
          docker exec -i \
            --env PGPASSWORD=health-migrator-password \
            pokemon-postgres-runtime-health psql \
            --host 127.0.0.1 \
            --username pokemon_health_migrator \
            --dbname runtime_health_proof \
            --set ON_ERROR_STOP=1 \
            --set migrator_role=pokemon_health_migrator \
            --set runtime_role=pokemon_health_runtime \
            < db/bootstrap/runtime_grants.sql

      - name: Run runtime health proof
        env:
          DATABASE_URL: postgresql://pokemon_health_runtime:health-runtime-password@localhost:5432/runtime_health_proof
        run: node --import tsx db/proofs/phase17_runtime_health_e2e.ts
