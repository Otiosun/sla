name: Evolution Condition Owner V2 Temp

on:
  push:
    branches:
      - fix/phase11-runtime-integrity-clean-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/phase11-runtime-integrity-clean-v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - name: Apply and validate
        run: |
          python3 scripts/phase11_condition_owner_patch.py
          pnpm exec biome check --write src/modules/progression/evolution-condition-contracts.ts src/modules/progression/evolution-condition-ports.ts src/modules/progression/evolution-condition-service.ts src/platform/progression/postgres-evolution-condition-repository.ts db/proofs/phase11_progression_e2e.ts
          pnpm typecheck
          pnpm exec vitest run tests/progression
      - name: Commit clean working tree
        run: |
          git rm .github/workflows/evolution-condition-owner-temp.yml .github/workflows/evolution-condition-owner-v2-temp.yml scripts/phase11_condition_owner_patch.py
          git add src/modules/progression/evolution-condition-contracts.ts src/modules/progression/evolution-condition-ports.ts src/modules/progression/evolution-condition-service.ts src/platform/progression/postgres-evolution-condition-repository.ts db/proofs/phase11_progression_e2e.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: own evolution condition state in progression"
          git push origin HEAD:fix/phase11-runtime-integrity-clean-v2
