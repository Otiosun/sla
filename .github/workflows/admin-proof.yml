name: Admin Proof

on:
  push:
    branches:
      - main
      - "gate/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: admin-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: authorization / registry / Player 360 / domain operations evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test \
              --set ON_ERROR_STOP=1 --tuples-only --command "SELECT 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1

      - name: Apply immutable migrations
        run: pnpm db:migrate

      - name: Seed admin authorization policy twice
        run: |
          pnpm db:seed:phase12
          pnpm db:seed:phase12

      - name: Verify migrated schema
        run: pnpm db:verify

      - name: Run admin unit invariants
        run: pnpm exec vitest run tests/admin

      - name: Run PostgreSQL Admin Registry E2E
        run: node --import tsx db/proofs/phase12_admin_registry_e2e.ts

      - name: Run PostgreSQL Player 360 E2E
        run: node --import tsx db/proofs/phase12_player360_e2e.ts

      - name: Run PostgreSQL Phase 12C Domain Admin E2E
        run: node --import tsx db/proofs/phase12_domain_admin_e2e.ts

      - name: Run PostgreSQL Pokemon Admin Owner E2E
        run: node --import tsx db/proofs/phase12_pokemon_admin_owner_e2e.ts

      - name: Run PostgreSQL Pokemon Lifecycle Admin E2E
        run: node --import tsx db/proofs/phase12_pokemon_admin_lifecycle_e2e.ts

      - name: Run PostgreSQL Encounter Admin E2E
        run: node --import tsx db/proofs/phase12_encounter_admin_e2e.ts

      - name: Run PostgreSQL Battle Admin E2E
        run: node --import tsx db/proofs/phase12_battle_admin_e2e.ts

      - name: Run PostgreSQL Server-side Admin Batch E2E
        run: node --import tsx db/proofs/phase12_admin_batch_e2e.ts

      - name: Run PostgreSQL Admin Compensation E2E
        run: node --import tsx db/proofs/phase12_admin_compensation_e2e.ts

      - name: Run PostgreSQL Admin Audit Reconstruction E2E
        run: node --import tsx db/proofs/phase12_admin_audit_reconstruction_e2e.ts

      - name: Seed canonical catalog for release lifecycle E2E
        run: pnpm db:seed:phase4

      - name: Run PostgreSQL Catalog Draft Admin E2E
        run: node --import tsx db/proofs/phase12_catalog_draft_admin_e2e.ts

      - name: Run PostgreSQL Catalog Release Admin E2E
        run: node --import tsx db/proofs/phase12_catalog_release_admin_e2e.ts

      - name: Run Phase 16 concurrent admin release race proof
        run: node --import tsx db/proofs/phase16_admin_concurrency_e2e.ts

      - name: Seed Phase 17 integrated happy-path stack
        run: |
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:seed:phase11
          pnpm db:seed:phase12

      - name: Run Phase 17 full happy-path E2E
        run: node --import tsx db/proofs/phase17_happy_path_e2e.ts
