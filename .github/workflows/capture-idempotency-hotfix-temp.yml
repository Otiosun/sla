name: Capture Idempotency Hotfix Temp

on:
  push:
    branches:
      - feat/capture-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(capture):') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/capture-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
          check-latest: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch terminal lock race
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/capture/service.ts')
          text = path.read_text()
          old = "        const context = await transaction.loadContext(\n          input.playerId,\n          input.encounterId,\n          input.ballItemId,\n        );\n        if (context === null) return err(captureNotFound());\n\n        const racedReplay = await transaction.findAttempt(idempotency.value.storageKey);\n"
          new = "        const context = await transaction.loadContext(\n          input.playerId,\n          input.encounterId,\n          input.ballItemId,\n        );\n        if (context === null) {\n          const terminalReplay = await transaction.findAttempt(idempotency.value.storageKey);\n          return terminalReplay === null\n            ? err(captureNotFound())\n            : replay(terminalReplay, fingerprint);\n        }\n\n        const racedReplay = await transaction.findAttempt(idempotency.value.storageKey);\n"
          if old not in text:
              raise SystemExit('Expected CaptureService block not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Canonical format
        run: pnpm exec biome format --write src/modules/capture/service.ts

      - name: Commit exact hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/capture/service.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(capture): replay after terminal lock race"
          git push origin HEAD:feat/capture-v1
