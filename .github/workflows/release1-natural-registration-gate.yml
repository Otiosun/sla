name: Registration Natural Path — Release Candidate / Disposable PG

on:
  pull_request:
    branches:
      - fix/release1-formatting-20261030
    paths:
      - ".github/workflows/release1-natural-registration-gate.yml"

permissions:
  contents: read

jobs:
  registration-natural-uat:
    if: github.head_ref == 'gate/registration-natural-uat-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokemon_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_rpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      NODE_ENV: test
      WHATSAPP_ENABLED: "false"
      DATABASE_URL: postgresql://pokemon:test-only-password@127.0.0.1:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@127.0.0.1:5432/pokemon_rpg_test

    steps:
      - name: Checkout exact candidate branch without persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: gate/registration-natural-uat-20261031
          fetch-depth: 0 # exact baseline ancestry check needs complete history

      - name: Verify isolated source and no local secret files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f32763f675e1ea96c5e6d92757402a63ce550700" ||             test "$(git diff --name-only f32763f675e1ea96c5e6d92757402a63ce550700 HEAD)" = ".github/workflows/release1-natural-registration-gate.yml"
          test ! -e .env
          test ! -e .env.local
          test ! -d auth_info_baileys
          test "$APP_ENV" = test
          test "$WHATSAPP_ENABLED" = false
          case "$DATABASE_URL" in
            postgresql://pokemon:test-only-password@127.0.0.1:5432/pokemon_rpg_test) ;;
            *) exit 1 ;;
          esac

      - name: Node 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Pinned pnpm, no dependency lifecycle scripts
        run: |
          npm install --global pnpm@11.23.0
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Migrate and seed disposable PostgreSQL (synthetic Zhoulia)
        run: |
          pnpm db:migrate
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:seed:phase11
          pnpm db:seed:phase12
          pnpm ops:seed:whatsapp-simulator-fixture

      - name: Natural registration / human review / starter / PvP+PvE / gameplay
        run: pnpm uat:whatsapp:multi
