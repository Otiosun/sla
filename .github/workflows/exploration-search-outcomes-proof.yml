name: Exploration Search Outcome Ledger Proof

on:
  pull_request:
    branches:
      - feat/exploration-atomic-first-action-20261030
    paths:
      - src/platform/exploration/postgres-expedition-repository.ts
      - src/platform/exploration/expedition-search-outcome-effect.ts
      - src/platform/encounter/postgres-encounter-repository.ts
      - tests/db/encounter.integration.test.ts
      - db/drafts/solo_exploration_v1_schema.sql
      - tests/db/solo-expedition-repository.integration.test.ts
      - .github/workflows/exploration-search-outcomes-proof.yml

permissions:
  contents: read

jobs:
  atomic-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      NODE_ENV: test
      WHATSAPP_ENABLED: "false"
      DATABASE_URL: postgresql://pokemon:test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify disposable database target
        run: |
          node -e "const u=new URL(process.env.DATABASE_URL);if(u.hostname!=='127.0.0.1'||u.port!=='5432'||u.pathname!=='/postgres'||process.env.APP_ENV!=='test')process.exit(1)"
      - name: TypeScript and first-action transactional contracts
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/db/solo-expedition-repository.integration.test.ts tests/exploration/expedition-state.test.ts tests/db/encounter.integration.test.ts
