name: Capture Proof Fix Temp

on:
  push:
    branches:
      - feat/capture-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'test(capture): fix proof UUID/text audit cast') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/capture-v1
          fetch-depth: 0

      - name: Patch exact audit cast
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('db/proofs/phase10_capture_e2e.ts')
          text = path.read_text()
          old = "           AND payload ->> 'captureAttemptId' = $3) AS capture_events"
          new = "           AND payload ->> 'captureAttemptId' = $3::text) AS capture_events"
          if old not in text:
              raise SystemExit('Expected Phase 10 audit expression not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit exact proof fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/proofs/phase10_capture_e2e.ts
          git commit -m "test(capture): fix proof UUID/text audit cast"
          git push origin HEAD:feat/capture-v1
