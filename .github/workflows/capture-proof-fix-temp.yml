name: Capture Proof Fix Temp

on:
  push:
    branches:
      - feat/capture-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/capture-v1
          fetch-depth: 0

      - name: Patch exact audit cast
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/payload ->> 'captureAttemptId' = \$3)/payload ->> 'captureAttemptId' = \$3::text)/" db/proofs/phase10_capture_e2e.ts

      - name: Commit when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- db/proofs/phase10_capture_e2e.ts; then
            echo "Audit cast already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/proofs/phase10_capture_e2e.ts
          git commit -m "test(capture): fix proof UUID text audit cast"
          git push origin HEAD:feat/capture-v1
