name: Temporary Phase 7 Test Fix

on:
  push:
    branches:
      - feat/world-location-exploration-v1

permissions:
  contents: write

concurrency:
  group: phase7-test-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/world-location-exploration-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply fixture fix
        run: python scripts/phase7_test_fixture_fix.py

      - name: Remove temporary artifacts
        run: |
          rm scripts/phase7_test_fixture_fix.py
          rm .github/workflows/phase7-test-fix.yml

      - name: Canonical format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Diff sanity
        run: git diff --check

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(world): align onboarding fixture and formatting"
          git push origin HEAD:feat/world-location-exploration-v1
