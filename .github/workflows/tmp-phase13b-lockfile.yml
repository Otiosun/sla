name: TEMP Phase 13B Lockfile

on:
  push:
    branches:
      - work/phase13b-baileys-provider-v1

permissions:
  contents: write

concurrency:
  group: tmp-phase13b-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/phase13b-baileys-provider-v1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Resolve pinned Baileys dependency
        run: pnpm add --save-exact @whiskeysockets/baileys@7.0.0-rc14 --lockfile-only

      - name: Commit dependency metadata back to WIP branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile already current"
            exit 0
          fi
          git commit -m "chore: pin Baileys provider [lockfile-generated]"
          git push origin HEAD:work/phase13b-baileys-provider-v1
