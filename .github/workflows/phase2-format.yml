name: Temporary phase2 formatter

on:
  push:
    branches:
      - migration/0001-core-schema-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/0001-core-schema-v1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Apply project formatter
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.23.0
          pnpm install --frozen-lockfile
          pnpm format

      - name: Commit formatter output if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatting already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical formatting after phase2 hardening"
          git push origin HEAD:migration/0001-core-schema-v1
