name: V62 Temporary Autoformat

on:
  push:
    branches:
      - "feature/spawn-battle-director-v62"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/spawn-battle-director-v62
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.23.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec biome format --write .
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "V62 Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(v62): apply Biome formatting"
          git push origin HEAD:feature/spawn-battle-director-v62
