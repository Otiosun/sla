name: WIP Phase 15 Null PP Fix

on:
  push:
    branches:
      - feat/phase15-gen123-import-wip

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase15-gen123-import-wip
      - name: Patch null PP handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("db/imports/gen123/model.ts")
          s = p.read_text()
          pairs = [
            ("  readonly pp: number;", "  readonly pp: number | null;"),
            ('        pp: requiredInt(row, "pp"),', '        pp: optionalInt(row, "pp"),'),
            (
              "  const allowedMoveIds = new Set(moves.map((move) => move.sourceId));",
              "  // Moves with unknown PP remain catalogued, but cannot enter executable START/LEVEL learnsets.\n  const allowedMoveIds = new Set(\n    moves.filter((move) => move.pp !== null).map((move) => move.sourceId),\n  );",
            ),
          ]
          for old, new in pairs:
            if s.count(old) != 1:
              raise SystemExit(f"model marker changed: {old}")
            s = s.replace(old, new)
          p.write_text(s)

          p = Path("db/imports/gen123/validate.ts")
          s = p.read_text()
          old = "AND (form.id IS NULL OR move.id IS NULL)) +"
          new = "AND (form.id IS NULL OR move.id IS NULL OR move.max_pp IS NULL)) +"
          if s.count(old) != 1:
            raise SystemExit("validator learnset ref marker changed")
          s = s.replace(old, new)
          old = '        "ability-mechanical-effects-explicitly-unsupported-unless-engine-keyed",'
          new = '        "moves-with-source-null-pp-preserved-but-excluded-from-executable-learnsets",\n        "ability-mechanical-effects-explicitly-unsupported-unless-engine-keyed",'
          if s.count(old) != 1:
            raise SystemExit("coverage marker changed")
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit code fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/imports/gen123/model.ts db/imports/gen123/validate.ts
          git diff --cached --quiet && exit 0
          git commit -m "wip: preserve null PP without exposing unusable learnsets"
          git push origin HEAD:feat/phase15-gen123-import-wip
