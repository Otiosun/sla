name: Pokédex Capture Callsite Temp

on:
  push:
    branches:
      - fix/phase11-pokedex-condition-integrity-clean-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/phase11-pokedex-condition-integrity-clean-v1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Patch capture callsite and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/platform/capture/postgres-capture-repository.ts')
          text = path.read_text()
          old_import = 'import { recordPokedexOwned } from "../pokedex/postgres-pokedex-writer.js";'
          new_import = 'import { recordPokedexCaught } from "../pokedex/postgres-pokedex-writer.js";'
          if text.count(old_import) != 1:
              raise SystemExit(f'expected one capture Pokédex import, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          old_call = 'await recordPokedexOwned(this.client, input.playerId, snapshot.speciesId);'
          new_call = 'await recordPokedexCaught(this.client, input.playerId, snapshot.speciesId);'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one capture Pokédex call, found {text.count(old_call)}')
          path.write_text(text.replace(old_call, new_call, 1))
          PY
          pnpm exec biome check --write src/platform/capture/postgres-capture-repository.ts src/platform/pokedex/postgres-pokedex-writer.ts tests/db/pokedex-writer.integration.test.ts src/platform/db/migrations.ts tests/db/migration-history-order.integration.test.ts
          pnpm typecheck
          pnpm exec vitest run tests/progression tests/capture
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pokedex-capture-callsite-temp.yml
          git add src/platform/capture/postgres-capture-repository.ts src/platform/pokedex/postgres-pokedex-writer.ts tests/db/pokedex-writer.integration.test.ts src/platform/db/migrations.ts tests/db/migration-history-order.integration.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve Pokédex event count semantics"
          git push origin HEAD:fix/phase11-pokedex-condition-integrity-clean-v1
