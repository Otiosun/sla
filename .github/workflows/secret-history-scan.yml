name: Secret history scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: full git history / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan full repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          history_commit_count="$(git rev-list --all --count)"
          echo "GITLEAKS_FULL_HISTORY_COMMIT_COUNT=${history_commit_count}"
          if [ "${history_commit_count}" -le 1 ]; then
            echo "Expected more than one commit for full-history scan." >&2
            exit 1
          fi
          gitleaks detect --redact --verbose --exit-code=2 --log-opts="--all"
