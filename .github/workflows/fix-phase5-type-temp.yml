name: Temporary Phase 5 Type Fix

on:
  push:
    branches:
      - feat/player-onboarding-starter-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Repair DATABASE_URL narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/db/player-onboarding.integration.test.ts')
          text = path.read_text()
          old = '''const databaseUrl = process.env.DATABASE_URL;
          if (databaseUrl === undefined) {
            throw new Error("DATABASE_URL is required for PostgreSQL integration tests");
          }
          '''
          new = '''const databaseUrl = (() => {
            const value = process.env.DATABASE_URL;
            if (value === undefined) {
              throw new Error("DATABASE_URL is required for PostgreSQL integration tests");
            }
            return value;
          })();
          '''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit type fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/db/player-onboarding.integration.test.ts
          git commit -m "test(player): narrow database url for strict types"
          git push origin "HEAD:${GITHUB_REF_NAME}"
