name: Temporary Phase 17 World Formatter

on:
  push:
    branches:
      - feat/staging-content-bootstrap-v1
    paths:
      - ".github/workflows/tmp-format-phase17-world.yml"
      - "db/imports/gen123/world.ts"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format world reconciliation
        run: pnpm exec biome format --write db/imports/gen123/world.ts

      - name: Upload formatted file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase17-world-formatted
          path: db/imports/gen123/world.ts
          if-no-files-found: error
          retention-days: 1
