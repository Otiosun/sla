name: Battle Concurrency Fix Once

on:
  push:
    branches:
      - feat/battle-engine-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/battle-engine-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test --tuples-only --command 'SELECT 1;' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1

      - name: Harden battle concurrency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/platform/battle/postgres-battle-repository.ts')
          text = path.read_text()

          old_party = '''    const playerParty = await Promise.all(\n      party.rows.map((row) => this.enrichPlayerPokemon(root.contentReleaseId, row)),\n    );'''
          new_party = '''    const playerParty: BattlePokemonBuild[] = [];\n    for (const row of party.rows) {\n      playerParty.push(await this.enrichPlayerPokemon(root.contentReleaseId, row));\n    }'''
          if text.count(old_party) != 1:
              raise SystemExit('player party Promise.all anchor mismatch')
          text = text.replace(old_party, new_party)

          class_anchor = 'class PostgresBattleTransaction implements BattleTransaction {'
          helpers = '''const MAX_SERIALIZABLE_ATTEMPTS = 3;\n\nfunction postgresErrorCode(error: unknown): string | null {\n  if (error === null || typeof error !== "object" || !("code" in error)) return null;\n  const code = (error as { readonly code?: unknown }).code;\n  return typeof code === "string" ? code : null;\n}\n\nfunction isRetryableSerializableError(error: unknown): boolean {\n  const code = postgresErrorCode(error);\n  return code === "40001" || code === "40P01";\n}\n\n'''
          if helpers not in text:
              if text.count(class_anchor) != 1:
                  raise SystemExit('battle transaction class anchor mismatch')
              text = text.replace(class_anchor, helpers + class_anchor)

          old_tx = '''  public async transaction<T>(work: (transaction: BattleTransaction) => Promise<T>): Promise<T> {\n    return withTransaction(\n      this.pool,\n      async (client) => work(new PostgresBattleTransaction(client)),\n      { isolationLevel: "SERIALIZABLE" },\n    );\n  }'''
          new_tx = '''  public async transaction<T>(work: (transaction: BattleTransaction) => Promise<T>): Promise<T> {\n    for (let attempt = 1; attempt <= MAX_SERIALIZABLE_ATTEMPTS; attempt += 1) {\n      try {\n        return await withTransaction(\n          this.pool,\n          async (client) => work(new PostgresBattleTransaction(client)),\n          { isolationLevel: "SERIALIZABLE" },\n        );\n      } catch (error) {\n        const retryable = isRetryableSerializableError(error);\n        if (!retryable || attempt === MAX_SERIALIZABLE_ATTEMPTS) throw error;\n      }\n    }\n    throw new Error("Unreachable PostgreSQL serializable retry state");\n  }'''
          if text.count(old_tx) != 1:
              raise SystemExit('battle repository transaction anchor mismatch')
          text = text.replace(old_tx, new_tx)
          if 'Promise.all(\n      party.rows.map' in text:
              raise SystemExit('same-client Promise.all residue remains')
          path.write_text(text)
          PY

      - name: Apply canonical formatting
        run: pnpm format

      - name: Static quality gates
        run: |
          set -euo pipefail
          pnpm lint
          pnpm format:check
          pnpm typecheck
          git diff --check

      - name: Migrate and seed content
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:verify

      - name: Full test suite
        run: pnpm test

      - name: Battle PostgreSQL E2E
        run: node --import tsx db/proofs/phase9_battle_e2e.ts

      - name: Remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f battle-e2e-diagnostic.txt
          rm -f .github/workflows/battle-e2e-diagnostic-once.yml
          rm -f .github/workflows/battle-concurrency-fix-once.yml

      - name: Commit permanent concurrency hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'battle: harden serializable concurrency'
          git push origin HEAD:feat/battle-engine-v1
