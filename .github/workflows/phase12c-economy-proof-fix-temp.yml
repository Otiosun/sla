name: Phase 12C Economy Proof Fix Temp

on:
  push:
    branches:
      - feat/phase12c-domain-admin-operations-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase12c-domain-admin-operations-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - name: Fix proof bind typing and import type
        shell: python
        run: |
          from pathlib import Path

          proof = Path('db/proofs/phase12_domain_admin_e2e.ts')
          text = proof.read_text()
          text = text.replace(
              "(SELECT count(*)::text FROM admin_operation_changes WHERE admin_operation_id = $3) AS change_count,",
              "(SELECT count(*)::text FROM admin_operation_changes WHERE admin_operation_id = $4) AS change_count,",
          )
          text = text.replace(
              "(SELECT count(*)::text FROM audit_events WHERE causation_id = $3) AS audit_count",
              "(SELECT count(*)::text FROM audit_events WHERE causation_id = $5) AS audit_count",
          )
          text = text.replace(
              'JOIN inventory_ledger ledger ON ledger.source_id = $3\n',
              'JOIN inventory_ledger ledger ON ledger.source_id = $3::text\n',
          )
          text = text.replace(
              'JOIN admin_operation_changes change ON change.admin_operation_id = $3\n',
              'JOIN admin_operation_changes change ON change.admin_operation_id = $4\n',
          )
          text = text.replace(
              '[playerId, itemId, crashWindow.operation.id],\n  );\n  const reconstructionRow',
              '[\n      playerId,\n      itemId,\n      crashWindow.operation.id,\n      crashWindow.operation.id,\n      crashWindow.operation.id,\n    ],\n  );\n  const reconstructionRow',
          )
          proof.write_text(text)

          definitions = Path('src/modules/admin/domain-definitions.ts')
          text = definitions.read_text().replace(
              'import { AdminOperationRegistry, defineAdminOperation } from "./operation-registry.js";',
              'import { type AdminOperationRegistry, defineAdminOperation } from "./operation-registry.js";',
          )
          definitions.write_text(text)
      - run: pnpm exec biome format --write db/proofs/phase12_domain_admin_e2e.ts src/modules/admin/domain-service.ts src/modules/admin/domain-definitions.ts
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name pokemon-postgres \
            --env POSTGRES_USER=pokemon --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test --set ON_ERROR_STOP=1 --tuples-only --command "SELECT 1;" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1
      - run: pnpm db:migrate
      - run: |
          pnpm db:seed:phase12
          pnpm db:seed:phase12
      - run: pnpm db:verify
      - run: pnpm exec vitest run tests/admin tests/economy
      - run: node --import tsx db/proofs/phase12_admin_registry_e2e.ts
      - run: node --import tsx db/proofs/phase12_player360_e2e.ts
      - run: node --import tsx db/proofs/phase12_domain_admin_e2e.ts
      - name: Commit validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/proofs/phase12_domain_admin_e2e.ts src/modules/admin/domain-service.ts src/modules/admin/domain-definitions.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: harden Phase 12C economy admin evidence'
          git push origin HEAD:feat/phase12c-domain-admin-operations-v1
