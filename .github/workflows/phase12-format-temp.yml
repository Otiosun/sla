name: Phase 12 Pokemon Formatter Temp

on:
  push:
    branches:
      - gate/phase12c-pokemon-admin-owner-format-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gate/phase12c-pokemon-admin-owner-format-v1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Biome formatter to failing files
        run: |
          pnpm exec biome format --write \
            db/proofs/phase12_pokemon_effect_admin_e2e.ts \
            src/modules/pokemon/admin-service.ts \
            src/modules/pokemon/effect-admin-ports.ts \
            src/platform/pokemon/postgres-pokemon-effect-admin-repository.ts
          pnpm format:check

      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            db/proofs/phase12_pokemon_effect_admin_e2e.ts \
            src/modules/pokemon/admin-service.ts \
            src/modules/pokemon/effect-admin-ports.ts \
            src/platform/pokemon/postgres-pokemon-effect-admin-repository.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style: format Phase 12 Pokemon admin owner files"
          git push origin HEAD:gate/phase12c-pokemon-admin-owner-format-v1
