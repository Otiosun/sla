name: Diagnostic Phase 11 Final Gates

on:
  push:
    branches:
      - diag/phase11-final-gates-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql --username pokemon --dbname pokemon_rpg_test --set ON_ERROR_STOP=1 --tuples-only --command "SELECT 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1
      - name: Quality
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
      - name: Apply and replay migrations
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:verify
      - name: Seed Phase 11 slice
        run: |
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:seed:phase11
      - name: Focused domain and PostgreSQL regressions
        run: |
          pnpm exec vitest run \
            tests/progression \
            tests/capture \
            tests/db/migration-history-order.integration.test.ts \
            tests/db/pokedex-writer.integration.test.ts \
            tests/db/encounter.integration.test.ts \
            tests/db/player-onboarding.integration.test.ts
      - name: Progression PostgreSQL E2E
        run: node --import tsx db/proofs/phase11_progression_e2e.ts
      - name: Capture PostgreSQL E2E
        run: node --import tsx db/proofs/phase10_capture_e2e.ts
