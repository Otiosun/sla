name: Progression Proof

on:
  push:
    branches:
      - main
      - "gate/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: progression-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: migrate / seed / progression atomicity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name pokemon-postgres \
            --env POSTGRES_USER=pokemon \
            --env POSTGRES_PASSWORD=test-only-password \
            --env POSTGRES_DB=pokemon_rpg_test \
            --publish 5432:5432 \
            postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql \
              --username pokemon \
              --dbname pokemon_rpg_test \
              --set ON_ERROR_STOP=1 \
              --tuples-only \
              --command "SELECT 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs pokemon-postgres
          exit 1

      - name: Apply immutable migrations
        run: pnpm db:migrate

      - name: Seed historical Phase 11 content
        run: |
          pnpm db:seed:phase4
          pnpm db:seed:phase5
          pnpm db:seed:phase6
          pnpm db:seed:phase7
          pnpm db:seed:phase11:provisional

      - name: Verify migrated schema
        run: pnpm db:verify

      - name: Run progression domain invariants
        run: pnpm exec vitest run tests/progression

      - name: Run historical transactional Progression PostgreSQL E2E
        run: node --import tsx db/proofs/phase11_progression_e2e.ts

      - name: Seed canonical trainer progression twice
        run: |
          pnpm db:seed:phase11:final
          pnpm db:seed:phase11:final

      - name: Run canonical trainer progression PostgreSQL E2E
        run: node --import tsx db/proofs/phase11_trainer_final_e2e.ts
