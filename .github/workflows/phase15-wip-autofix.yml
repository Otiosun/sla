name: Phase 15 WIP Autofix

on:
  push:
    branches:
      - feat/phase15-world-graph-publish-wip

permissions:
  contents: write

jobs:
  patch-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout WIP branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/phase15-world-graph-publish-wip
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch lifecycle fingerprinting
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          import_path = Path('db/imports/gen123/import.ts')
          text = import_path.read_text()
          old = '''import { createHash } from "node:crypto";
          import { Pool, type PoolClient } from "pg";'''.replace('          ', '')
          new = '''import { Pool, type PoolClient } from "pg";
          import { fingerprintRuleset } from "../../../src/modules/catalog/fingerprint.js";'''.replace('          ', '')
          assert old in text
          text = text.replace(old, new, 1)

          old = '''function fingerprint(value: unknown): string {
            return createHash("sha256").update(JSON.stringify(value)).digest("hex");
          }

          '''.replace('          ', '')
          assert old in text
          text = text.replace(old, '', 1)

          old = '''  const matchups: (readonly unknown[])[] = [];
            for (const attacking of typeRows) {
              for (const defending of typeRows) {
                const attackSource = requiredInt(attacking, "id");
                const defendSource = requiredInt(defending, "id");
                matchups.push([
                  id,
                  typeMap.get(attackSource),
                  typeMap.get(defendSource),
                  (efficacy.get(`${attackSource}:${defendSource}`) ?? 100) * 100,
                ]);
              }
            }'''.replace('            ', '')
          new = '''  const matchups: (readonly unknown[])[] = [];
            const rulesetTypeMatchups: {
              attackingTypeId: string;
              defendingTypeId: string;
              multiplierBasisPoints: number;
            }[] = [];
            for (const attacking of typeRows) {
              for (const defending of typeRows) {
                const attackSource = requiredInt(attacking, "id");
                const defendSource = requiredInt(defending, "id");
                const attackingTypeId = typeMap.get(attackSource);
                const defendingTypeId = typeMap.get(defendSource);
                if (attackingTypeId === undefined || defendingTypeId === undefined)
                  throw new Error(`Ruleset type identity missing for ${attackSource}:${defendSource}`);
                const multiplierBasisPoints =
                  (efficacy.get(`${attackSource}:${defendSource}`) ?? 100) * 100;
                matchups.push([id, attackingTypeId, defendingTypeId, multiplierBasisPoints]);
                rulesetTypeMatchups.push({
                  attackingTypeId,
                  defendingTypeId,
                  multiplierBasisPoints,
                });
              }
            }'''.replace('            ', '')
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    [id, JSON.stringify(report), fingerprint(baseRow.config)],'''
          new = '''    [
              id,
              JSON.stringify(report),
              fingerprintRuleset({
                id,
                status: "DRAFT",
                config: baseRow.config,
                typeMatchups: rulesetTypeMatchups,
              }),
            ],'''.replace('            ', '')
          assert old in text
          text = text.replace(old, new, 1)
          import_path.write_text(text)

          validate_path = Path('db/imports/gen123/final-validate.ts')
          text = validate_path.read_text()
          needle = '''    const rulesetFingerprint = fingerprintRuleset(rulesetSnapshot);
          '''.replace('          ', '')
          replacement = '''    const rulesetFingerprint = fingerprintRuleset(rulesetSnapshot);
            const storedRulesetFingerprint = await pool.query<{ config_fingerprint: string | null }>(
              "SELECT config_fingerprint FROM rulesets WHERE id=$1",
              [release.default_ruleset_id],
            );
            if (storedRulesetFingerprint.rows[0]?.config_fingerprint !== rulesetFingerprint)
              throw new Error("Gen I-III ruleset fingerprint does not match canonical snapshot");
          '''.replace('          ', '')
          assert needle in text
          text = text.replace(needle, replacement, 1)

          old = '''    if (markValidated && release.status === "DRAFT") {
              const rulesetUpdate = await pool.query(
                "UPDATE rulesets SET config_fingerprint=$2 WHERE id=$1 AND status='VALIDATED'",
                [release.default_ruleset_id, rulesetFingerprint],
              );
              if (rulesetUpdate.rowCount !== 1) throw new Error("Ruleset fingerprint update failed");

              const catalogSnapshot = await repository.read((transaction) =>
          '''.replace('          ', '')
          new = '''    if (markValidated && release.status === "DRAFT") {
              const catalogSnapshot = await repository.read((transaction) =>
          '''.replace('          ', '')
          assert old in text
          text = text.replace(old, new, 1)
          validate_path.write_text(text)
          PY

      - name: Format canonical files
        run: >-
          pnpm exec biome format --write
          db/imports/gen123/import.ts
          db/imports/gen123/final-validate.ts
          db/imports/gen123/publish.ts
          db/imports/gen123/world-source.ts
          db/imports/gen123/world.ts
          db/proofs/phase15_final_release_e2e.ts

      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Commit WIP fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            db/imports/gen123/import.ts \
            db/imports/gen123/final-validate.ts \
            db/imports/gen123/publish.ts \
            db/imports/gen123/world-source.ts \
            db/imports/gen123/world.ts \
            db/proofs/phase15_final_release_e2e.ts
          if git diff --cached --quiet; then
            echo "No autofix changes required."
            exit 0
          fi
          git commit -m "fix: canonical Phase 15 lifecycle fingerprints"
          git push origin HEAD:feat/phase15-world-graph-publish-wip
