name: Phase 11 Canonical Hardening Temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/phase11-pokedex-condition-integrity-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/phase11-pokedex-condition-integrity-v1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integrate Pokédex owners and CONDITION evolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Public CONDITION evolution contract.
          replace_once(
              'src/modules/progression/contracts.ts',
              '      z.object({ kind: z.literal("ITEM"), itemId: uuid }).strict(),\n',
              '      z.object({ kind: z.literal("ITEM"), itemId: uuid }).strict(),\n'
              '      z\n'
              '        .object({\n'
              '          kind: z.literal("CONDITION"),\n'
              '          conditionKey: z.string().regex(/^[a-z0-9][a-z0-9-]{0,63}$/),\n'
              '        })\n'
              '        .strict(),\n',
          )

          # Progression repository: central Pokédex writer + condition eligibility.
          replace_once(
              'src/platform/progression/postgres-progression-repository.ts',
              'import { withTransaction } from "../db/transaction.js";\n',
              'import { withTransaction } from "../db/transaction.js";\n'
              'import { recordPokedexOwned } from "../pokedex/postgres-pokedex-writer.js";\n',
          )
          p = Path('src/platform/progression/postgres-progression-repository.ts')
          text = p.read_text()
          text, count = re.subn(
              r'\nasync function markPokedexOwned\([\s\S]*?\n}\n\nasync function insertOutbox',
              '\nasync function insertOutbox',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('progression repository: local Pokédex writer target not found once')
          text = text.replace('await markPokedexOwned(', 'await recordPokedexOwned(')
          old = '''    const fingerprint = hashParts(\n      input.pokemonInstanceId,\n      input.trigger.kind,\n      input.trigger.kind === "ITEM" ? input.trigger.itemId : "server-level",\n    );'''
          new = '''    const fingerprint = hashParts(\n      input.pokemonInstanceId,\n      input.trigger.kind,\n      input.trigger.kind === "ITEM"\n        ? input.trigger.itemId\n        : input.trigger.kind === "CONDITION"\n          ? input.trigger.conditionKey\n          : "server-level",\n    );'''
          if text.count(old) != 1:
              raise SystemExit('progression repository: fingerprint target not found once')
          text = text.replace(old, new, 1)
          old = '''      const eligible = rules.rows.filter((rule) => {\n        if (input.trigger.kind === "LEVEL") {\n          const parsed = EvolutionTriggerSchemas.LEVEL.safeParse(rule.trigger_config);\n          return parsed.success && pokemonRow.level >= parsed.data.level;\n        }\n        const parsed = EvolutionTriggerSchemas.ITEM.safeParse(rule.trigger_config);\n        return parsed.success && parsed.data.itemId === input.trigger.itemId;\n      });'''
          new = '''      const eligible = rules.rows.filter((rule) => {\n        if (input.trigger.kind === "LEVEL") {\n          const parsed = EvolutionTriggerSchemas.LEVEL.safeParse(rule.trigger_config);\n          return parsed.success && pokemonRow.level >= parsed.data.level;\n        }\n        if (input.trigger.kind === "ITEM") {\n          const parsed = EvolutionTriggerSchemas.ITEM.safeParse(rule.trigger_config);\n          return parsed.success && parsed.data.itemId === input.trigger.itemId;\n        }\n        const parsed = EvolutionTriggerSchemas.CONDITION.safeParse(rule.trigger_config);\n        return parsed.success && parsed.data.conditionKey === input.trigger.conditionKey;\n      });'''
          if text.count(old) != 1:
              raise SystemExit('progression repository: eligibility target not found once')
          text = text.replace(old, new, 1)
          old = '''      const rule = eligible[0];\n      if (rule === undefined) return { kind: "NOT_ELIGIBLE", reason: "No evolution rule matches" };\n      const claimId = randomUUID();'''
          new = '''      const rule = eligible[0];\n      if (rule === undefined) return { kind: "NOT_ELIGIBLE", reason: "No evolution rule matches" };\n\n      if (input.trigger.kind === "CONDITION") {\n        const condition = await client.query(\n          `SELECT 1\n           FROM pokemon_evolution_condition_flags\n           WHERE pokemon_instance_id = $1\n             AND condition_key = $2\n             AND status = 'ACTIVE'`,\n          [input.pokemonInstanceId, input.trigger.conditionKey],\n        );\n        if (condition.rows[0] === undefined) {\n          return { kind: "NOT_ELIGIBLE", reason: "Required evolution condition is not active" };\n        }\n      }\n\n      const claimId = randomUUID();'''
          if text.count(old) != 1:
              raise SystemExit('progression repository: condition insertion target not found once')
          p.write_text(text.replace(old, new, 1))

          # Capture uses the central owned event.
          replace_once(
              'src/platform/capture/postgres-capture-repository.ts',
              'import { withTransaction } from "../db/transaction.js";\n',
              'import { withTransaction } from "../db/transaction.js";\n'
              'import { recordPokedexOwned } from "../pokedex/postgres-pokedex-writer.js";\n',
          )
          p = Path('src/platform/capture/postgres-capture-repository.ts')
          text = p.read_text()
          pattern = re.compile(
              r'''    await this\.client\.query\(\n      `INSERT INTO player_pokedex_species\([\s\S]*?\n      \[input\.playerId, snapshot\.speciesId\],\n    \);'''
          )
          text, count = pattern.subn(
              '    await recordPokedexOwned(this.client, input.playerId, snapshot.speciesId);',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('capture repository: Pokédex block target not found once')
          p.write_text(text)

          # Starter becomes owned exactly once in the same grant transaction.
          replace_once(
              'src/platform/player/postgres-player-onboarding-repository.ts',
              'import { withTransaction } from "../db/transaction.js";\n',
              'import { withTransaction } from "../db/transaction.js";\n'
              'import { recordPokedexOwnedByForm } from "../pokedex/postgres-pokedex-writer.js";\n',
          )
          replace_once(
              'src/platform/player/postgres-player-onboarding-repository.ts',
              '    await this.client.query(\n      `INSERT INTO starter_grants(\n',
              '    await recordPokedexOwnedByForm(this.client, input.playerId, input.formId);\n'
              '    await this.client.query(\n      `INSERT INTO starter_grants(\n',
          )

          # Encounter CREATED -> PRESENTED records seen once; replay does not increment.
          replace_once(
              'src/platform/encounter/postgres-encounter-repository.ts',
              'import { withTransaction } from "../db/transaction.js";\n',
              'import { withTransaction } from "../db/transaction.js";\n'
              'import { recordPokedexSeen } from "../pokedex/postgres-pokedex-writer.js";\n',
          )
          replace_once(
              'src/platform/encounter/postgres-encounter-repository.ts',
              '''      ],\n    );\n    return result.rows[0] === undefined ? null : mapEncounter(result.rows[0]);\n  }\n\n  public async createBattle''',
              '''      ],\n    );\n    const row = result.rows[0];\n    if (row !== undefined && input.toStatus === "PRESENTED") {\n      const snapshot = await this.snapshot(input.encounterId);\n      if (snapshot === null) throw new Error("Presented encounter is missing its wild snapshot");\n      await recordPokedexSeen(this.client, input.playerId, snapshot.speciesId);\n    }\n    return row === undefined ? null : mapEncounter(row);\n  }\n\n  public async createBattle''',
          )

          # Encounter DB proof gets species identity and verifies replay-safe seen semantics.
          replace_once(
              'tests/db/encounter.integration.test.ts',
              '''interface Fixture {\n  readonly rulesetId: string;\n  readonly releaseId: string;\n  readonly areaId: string;\n}''',
              '''interface Fixture {\n  readonly rulesetId: string;\n  readonly releaseId: string;\n  readonly areaId: string;\n  readonly speciesId: string;\n}''',
          )
          replace_once(
              'tests/db/encounter.integration.test.ts',
              '  return { rulesetId, releaseId, areaId };\n',
              '  return { rulesetId, releaseId, areaId, speciesId };\n',
          )
          replace_once(
              'tests/db/encounter.integration.test.ts',
              '''    expect(observedReplay.revision).toBe(1n);\n\n    const engaged = unwrap(''',
              '''    expect(observedReplay.revision).toBe(1n);\n\n    const pokedex = await pool.query<{\n      seen_count: string;\n      caught_count: string;\n      first_seen_at: Date | null;\n      last_seen_at: Date | null;\n      first_caught_at: Date | null;\n      last_caught_at: Date | null;\n    }>(\n      `SELECT seen_count::text, caught_count::text,\n              first_seen_at, last_seen_at, first_caught_at, last_caught_at\n       FROM player_pokedex_species\n       WHERE player_id = $1 AND species_id = $2`,\n      [playerId, fixture.speciesId],\n    );\n    expect(pokedex.rows[0]).toMatchObject({\n      seen_count: "1",\n      caught_count: "0",\n      first_caught_at: null,\n      last_caught_at: null,\n    });\n    expect(pokedex.rows[0]?.first_seen_at).toBeInstanceOf(Date);\n    expect(pokedex.rows[0]?.last_seen_at).toBeInstanceOf(Date);\n\n    const engaged = unwrap(''',
          )

          # Starter DB proof records ownership once even with concurrent/restart retries.
          replace_once(
              'tests/db/player-onboarding.integration.test.ts',
              '''interface Fixture {\n  readonly regionId: string;\n  readonly formId: string;\n  readonly releaseId: string;\n}''',
              '''interface Fixture {\n  readonly regionId: string;\n  readonly formId: string;\n  readonly releaseId: string;\n  readonly speciesId: string;\n}''',
          )
          replace_once(
              'tests/db/player-onboarding.integration.test.ts',
              '  return { regionId, formId, releaseId };\n',
              '  return { regionId, formId, releaseId, speciesId };\n',
          )
          replace_once(
              'tests/db/player-onboarding.integration.test.ts',
              '''    expect(counts.rows[0]).toMatchObject({\n      pokemon_count: "1",\n      grant_count: "1",\n      roster_count: "1",\n    });\n\n    const immediateProfile''',
              '''    expect(counts.rows[0]).toMatchObject({\n      pokemon_count: "1",\n      grant_count: "1",\n      roster_count: "1",\n    });\n    const starterPokedex = await pool.query<{\n      seen_count: string;\n      caught_count: string;\n      first_seen_at: Date | null;\n      last_seen_at: Date | null;\n      first_caught_at: Date | null;\n      last_caught_at: Date | null;\n    }>(\n      `SELECT seen_count::text, caught_count::text,\n              first_seen_at, last_seen_at, first_caught_at, last_caught_at\n       FROM player_pokedex_species\n       WHERE player_id = $1 AND species_id = $2`,\n      [first.playerId, fixture.speciesId],\n    );\n    expect(starterPokedex.rows[0]).toMatchObject({ seen_count: "1", caught_count: "1" });\n    expect(starterPokedex.rows[0]?.first_seen_at).toBeInstanceOf(Date);\n    expect(starterPokedex.rows[0]?.last_seen_at).toBeInstanceOf(Date);\n    expect(starterPokedex.rows[0]?.first_caught_at).toBeInstanceOf(Date);\n    expect(starterPokedex.rows[0]?.last_caught_at).toBeInstanceOf(Date);\n\n    const immediateProfile''',
          )
          replace_once(
              'tests/db/player-onboarding.integration.test.ts',
              '''    expect(finalRetry.pokemonInstanceId).toBe(grantedA.pokemonInstanceId);\n    expect(finalRetry.replayed).toBe(true);\n''',
              '''    expect(finalRetry.pokemonInstanceId).toBe(grantedA.pokemonInstanceId);\n    expect(finalRetry.replayed).toBe(true);\n    const starterPokedexAfterRetry = await pool.query<{\n      seen_count: string;\n      caught_count: string;\n      first_seen_at: Date | null;\n      last_seen_at: Date | null;\n      first_caught_at: Date | null;\n      last_caught_at: Date | null;\n    }>(\n      `SELECT seen_count::text, caught_count::text,\n              first_seen_at, last_seen_at, first_caught_at, last_caught_at\n       FROM player_pokedex_species\n       WHERE player_id = $1 AND species_id = $2`,\n      [first.playerId, fixture.speciesId],\n    );\n    expect(starterPokedexAfterRetry.rows[0]).toEqual(starterPokedex.rows[0]);\n''',
          )

          # Strengthen Capture proof for the complete Pokédex invariant.
          p = Path('db/proofs/phase10_capture_e2e.ts')
          text = p.read_text()
          old = '''  const pokedex = await pool.query<{ caught_count: string }>(\n    `SELECT caught_count::text FROM player_pokedex_species\n     WHERE player_id = $1 AND species_id = $2`,\n    [fixture.playerId, snapshot.speciesId],\n  );\n  if (Number(pokedex.rows[0]?.caught_count ?? "0") < 1) {\n    throw new Error("Successful capture did not update Pokédex caught count");\n  }'''
          new = '''  const pokedex = await pool.query<{\n    seen_count: string;\n    caught_count: string;\n    first_seen_at: Date | null;\n    last_seen_at: Date | null;\n    first_caught_at: Date | null;\n    last_caught_at: Date | null;\n  }>(\n    `SELECT seen_count::text, caught_count::text,\n            first_seen_at, last_seen_at, first_caught_at, last_caught_at\n     FROM player_pokedex_species\n     WHERE player_id = $1 AND species_id = $2`,\n    [fixture.playerId, snapshot.speciesId],\n  );\n  const pokedexRow = pokedex.rows[0];\n  if (\n    pokedexRow === undefined ||\n    Number(pokedexRow.caught_count) < 1 ||\n    Number(pokedexRow.seen_count) < Number(pokedexRow.caught_count) ||\n    pokedexRow.first_seen_at === null ||\n    pokedexRow.last_seen_at === null ||\n    pokedexRow.first_caught_at === null ||\n    pokedexRow.last_caught_at === null\n  ) {\n    throw new Error(`Successful capture violated Pokédex invariant: ${JSON.stringify(pokedexRow)}`);\n  }'''
          if text.count(old) != 1:
              raise SystemExit('capture proof: Pokédex audit target not found once')
          p.write_text(text.replace(old, new, 1))

          # CONDITION evolution content + server-state proof.
          p = Path('db/proofs/phase11_progression_e2e.ts')
          text = p.read_text()
          helper = '''\nasync function createConditionEvolutionRelease(\n  pool: Pool,\n  parent: ReleaseRef,\n): Promise<{ release: ReleaseRef; conditionKey: string }> {\n  const catalog = new CatalogService(new PostgresCatalogRepository(pool));\n  const newReleaseId = randomUUID();\n  unwrap(\n    "clone condition-evolution proof release",\n    await catalog.clonePublishedRelease({\n      parentReleaseId: parent.releaseId,\n      newReleaseId,\n      releaseNo: 11_002n,\n      name: "Phase 11 Condition Evolution Proof",\n    }),\n  );\n  const from = await loadForm(pool, newReleaseId, "charmander");\n  const to = await loadForm(pool, newReleaseId, "charmeleon");\n  const conditionKey = "phase11-ready";\n  await pool.query(\n    `INSERT INTO evolution_rules(\n       id, content_release_id, from_form_id, to_form_id, trigger_kind, trigger_config, active\n     ) VALUES ($1, $2, $3, $4, 'CONDITION', $5::jsonb, TRUE)`,\n    [randomUUID(), newReleaseId, from.formId, to.formId, JSON.stringify({ conditionKey })],\n  );\n  unwrap("validate condition-evolution proof release", await catalog.validateRelease(newReleaseId));\n  unwrap("publish condition-evolution proof release", await catalog.publishRelease(newReleaseId));\n  unwrap("activate condition-evolution proof release", await catalog.activateRelease(newReleaseId));\n  return { release: { releaseId: newReleaseId, rulesetId: parent.rulesetId }, conditionKey };\n}\n'''
          marker = '\nasync function main(): Promise<void> {'
          if text.count(marker) != 1:
              raise SystemExit('progression proof: main marker not found once')
          text = text.replace(marker, helper + marker, 1)
          condition_proof = '''\n    const conditionProof = await createConditionEvolutionRelease(pool, itemProof.release);\n    const conditionPlayer = await createPlayerPokemon(pool, conditionProof.release, {\n      speciesSlug: "charmander",\n      level: 16,\n      xp: 0,\n      moveSlugs: ["tackle", "growl", "ember"],\n      trainerLevel: 1,\n      trainerPoints: 0,\n    });\n    const missingCondition = await service.evolvePokemon({\n      playerId: conditionPlayer.playerId,\n      pokemonInstanceId: conditionPlayer.pokemonId,\n      idempotencyKey: "phase11-condition-missing",\n      correlationId: randomUUID(),\n      trigger: { kind: "CONDITION", conditionKey: conditionProof.conditionKey },\n    });\n    expectFailure(\n      "missing server evolution condition",\n      missingCondition,\n      "EVOLUTION_NOT_ELIGIBLE",\n    );\n    const missingConditionAudit = await pool.query<{ species_slug: string; claims: string }>(\n      `SELECT species.slug AS species_slug,\n              (SELECT count(*)::text FROM pokemon_evolution_claims WHERE pokemon_instance_id = $1 AND trigger_kind = 'CONDITION') AS claims\n       FROM pokemon_instances instance\n       JOIN pokemon_forms form ON form.id = instance.form_id\n       JOIN pokemon_species species ON species.id = form.species_id\n       WHERE instance.id = $1`,\n      [conditionPlayer.pokemonId],\n    );\n    if (\n      missingConditionAudit.rows[0]?.species_slug !== "charmander" ||\n      missingConditionAudit.rows[0]?.claims !== "0"\n    ) {\n      throw new Error(\n        `Missing CONDITION flag leaked evolution state: ${JSON.stringify(missingConditionAudit.rows[0])}`,\n      );\n    }\n\n    const conditionCorrelationId = randomUUID();\n    await pool.query(\n      `INSERT INTO pokemon_evolution_condition_flags(\n         pokemon_instance_id, condition_key, status, source_type, source_id, correlation_id\n       ) VALUES ($1, $2, 'ACTIVE', 'PROOF', $3, $4)`,\n      [\n        conditionPlayer.pokemonId,\n        conditionProof.conditionKey,\n        "phase11-condition-proof",\n        conditionCorrelationId,\n      ],\n    );\n    const conditionInput = {\n      playerId: conditionPlayer.playerId,\n      pokemonInstanceId: conditionPlayer.pokemonId,\n      idempotencyKey: "phase11-condition-evolution",\n      correlationId: conditionCorrelationId,\n      trigger: { kind: "CONDITION" as const, conditionKey: conditionProof.conditionKey },\n    };\n    const conditionEvolution = unwrap(\n      "condition evolution",\n      await service.evolvePokemon(conditionInput),\n    );\n    if (conditionEvolution.replayed || conditionEvolution.triggerKind !== "CONDITION") {\n      throw new Error(`CONDITION evolution did not apply: ${JSON.stringify(conditionEvolution)}`);\n    }\n    const conditionReplay = unwrap(\n      "condition evolution replay",\n      await service.evolvePokemon(conditionInput),\n    );\n    if (!conditionReplay.replayed) throw new Error("CONDITION evolution retry did not replay");\n    const conditionAudit = await pool.query<{\n      species_slug: string;\n      claims: string;\n      flags: string;\n      caught: string;\n      seen: string;\n    }>(\n      `SELECT species.slug AS species_slug,\n              (SELECT count(*)::text FROM pokemon_evolution_claims WHERE pokemon_instance_id = $1 AND trigger_kind = 'CONDITION') AS claims,\n              (SELECT count(*)::text FROM pokemon_evolution_condition_flags WHERE pokemon_instance_id = $1 AND condition_key = $3 AND status = 'ACTIVE') AS flags,\n              (SELECT caught_count::text FROM player_pokedex_species entry JOIN pokemon_species dex_species ON dex_species.id = entry.species_id WHERE entry.player_id = $2 AND dex_species.slug = 'charmeleon') AS caught,\n              (SELECT seen_count::text FROM player_pokedex_species entry JOIN pokemon_species dex_species ON dex_species.id = entry.species_id WHERE entry.player_id = $2 AND dex_species.slug = 'charmeleon') AS seen\n       FROM pokemon_instances instance\n       JOIN pokemon_forms form ON form.id = instance.form_id\n       JOIN pokemon_species species ON species.id = form.species_id\n       WHERE instance.id = $1`,\n      [conditionPlayer.pokemonId, conditionPlayer.playerId, conditionProof.conditionKey],\n    );\n    const conditionAuditRow = conditionAudit.rows[0];\n    if (\n      conditionAuditRow === undefined ||\n      conditionAuditRow.species_slug !== "charmeleon" ||\n      conditionAuditRow.claims !== "1" ||\n      conditionAuditRow.flags !== "1" ||\n      Number(conditionAuditRow.caught) < 1 ||\n      Number(conditionAuditRow.seen) < Number(conditionAuditRow.caught)\n    ) {\n      throw new Error(`CONDITION evolution audit failed: ${JSON.stringify(conditionAuditRow)}`);\n    }\n'''
          marker = '''\n    console.log(\n      `Phase 11 progression proof complete: crash rollback, reward replay/concurrency, move choice, level evolution, trainer unlocks and item evolution are atomic`,\n    );'''
          if text.count(marker) != 1:
              raise SystemExit('progression proof: final log marker not found once')
          text = text.replace(marker, condition_proof + marker.replace('item evolution are atomic', 'item/condition evolution are atomic'), 1)
          p.write_text(text)
          PY

          pnpm exec biome check --write \
            src/modules/progression/contracts.ts \
            src/platform/progression/postgres-progression-repository.ts \
            src/platform/capture/postgres-capture-repository.ts \
            src/platform/player/postgres-player-onboarding-repository.ts \
            src/platform/encounter/postgres-encounter-repository.ts \
            src/platform/pokedex/postgres-pokedex-writer.ts \
            tests/db/encounter.integration.test.ts \
            tests/db/player-onboarding.integration.test.ts \
            db/proofs/phase10_capture_e2e.ts \
            db/proofs/phase11_progression_e2e.ts
          pnpm typecheck
          pnpm exec vitest run tests/progression

      - name: Commit validated integration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/modules/progression/contracts.ts \
            src/platform/progression/postgres-progression-repository.ts \
            src/platform/capture/postgres-capture-repository.ts \
            src/platform/player/postgres-player-onboarding-repository.ts \
            src/platform/encounter/postgres-encounter-repository.ts \
            src/platform/pokedex/postgres-pokedex-writer.ts \
            tests/db/encounter.integration.test.ts \
            tests/db/player-onboarding.integration.test.ts \
            db/proofs/phase10_capture_e2e.ts \
            db/proofs/phase11_progression_e2e.ts
          git commit -m "fix: close Phase 11 condition and Pokédex runtime gaps"
          git push origin HEAD:fix/phase11-pokedex-condition-integrity-v1
