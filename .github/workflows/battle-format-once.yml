name: Battle Typecheck Fix Once

on:
  push:
    branches:
      - feat/battle-engine-v1

permissions:
  contents: write

concurrency:
  group: battle-typecheck-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.repository == 'Otiosun/sla' && github.ref == 'refs/heads/feat/battle-engine-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/battle-engine-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply exact type-only fix and cleanup diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/battle/resolver.ts')
          text = path.read_text()
          old = 'function terminalStatus(state: BattleState): BattleState["status"] | null {'
          new = 'function terminalStatus(state: BattleState): "WON" | "LOST" | "DRAW" | null {'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one terminalStatus signature to patch')
          path.write_text(text.replace(old, new))
          PY
          rm -f .battle-typecheck-diagnostic.txt

      - name: Verify typecheck after exact fix
        run: pnpm typecheck

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/battle/resolver.ts
          git add -u .battle-typecheck-diagnostic.txt || true
          git commit -m "fix: narrow terminal battle status type"
          git push origin HEAD:feat/battle-engine-v1
