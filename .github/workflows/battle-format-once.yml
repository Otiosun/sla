name: Battle Typecheck Diagnostic Once

on:
  push:
    branches:
      - feat/battle-engine-v1

permissions:
  contents: write

concurrency:
  group: battle-typecheck-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.repository == 'Otiosun/sla' && github.ref == 'refs/heads/feat/battle-engine-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/battle-engine-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Capture typecheck diagnostics
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck > .battle-typecheck-diagnostic.txt 2>&1 || true
          cat .battle-typecheck-diagnostic.txt

      - name: Persist diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .battle-typecheck-diagnostic.txt
          git commit -m "chore: capture battle typecheck diagnostic"
          git push origin HEAD:feat/battle-engine-v1
