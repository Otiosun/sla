name: Battle Format Persistence Once

on:
  push:
    branches:
      - feat/battle-engine-v1

permissions:
  contents: write

concurrency:
  group: battle-format-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'Otiosun/sla' && github.ref == 'refs/heads/feat/battle-engine-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/battle-engine-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatter
        run: pnpm format

      - name: Commit formatting only when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/battle/ports.ts src/modules/battle/service.ts src/platform/rng/battle-seed-reader.ts src/platform/battle/postgres-battle-repository.ts
          git commit -m "style: format battle persistence"
          git push origin HEAD:feat/battle-engine-v1
