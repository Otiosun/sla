name: Combat and Exploration UX Reconciliation Proof
on:
  pull_request:
    branches:
      - integration/release-gate-20261030
    paths:
      - src/modules/pvp/whatsapp-handlers.ts
      - src/modules/exploration/expedition-contextual-menu.ts
      - src/modules/exploration/expedition-v4-active-panel.ts
      - tests/messaging/pvp-whatsapp.test.ts
      - tests/exploration/expedition-contextual-menu.test.ts
      - tests/exploration/expedition-v4-active-panel.test.ts
      - .github/workflows/ux-combat-exploration-reconcile-proof.yml
permissions:
  contents: read
jobs:
  ux:
    name: No-live typecheck and focused UX contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - name: PvP first turn and contextual exploration V4
        run: |
          pnpm exec vitest run \
            tests/messaging/pvp-whatsapp.test.ts \
            tests/exploration/expedition-contextual-menu.test.ts \
            tests/exploration/expedition-v4-active-panel.test.ts \
            tests/messaging/whatsapp-native-read-more.test.ts
