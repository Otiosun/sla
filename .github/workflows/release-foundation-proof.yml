name: Release Foundation Proof

on:
  push:
    branches:
      - gate/phase17-postdeploy-smoke-prereq-v1

permissions:
  contents: write

jobs:
  release-foundation:
    name: WIP exact package formatter oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Apply exact package formatter output
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome format --write package.json
          if git diff --quiet -- package.json; then
            echo "package.json already exact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Apply exact Biome 2.5.10 package formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
