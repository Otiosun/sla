name: Hub site backend compatibility

on:
  push:
    branches:
      - gate/hub-site-backend-pr172-compat-v1
  pull_request:
    branches:
      - gate/whatsapp-simulator-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      POSTGRES_INTEGRATION_TEST_URL: postgresql://pokemon:test-only-password@localhost:5432/postgres
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
      BELL_WORLD_TIME_OF_DAY: DAY

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL 18.6
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach             --name pokemon-postgres             --env POSTGRES_USER=pokemon             --env POSTGRES_PASSWORD=test-only-password             --env POSTGRES_DB=pokemon_rpg_test             --publish 5432:5432             postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2

          for attempt in {1..30}; do
            if docker exec pokemon-postgres psql               --username pokemon               --dbname pokemon_rpg_test               --set ON_ERROR_STOP=1               --tuples-only               --command "SELECT 1;" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          docker logs pokemon-postgres
          exit 1

      - name: Format Hub compatibility files
        run: |
          pnpm exec biome format             src/modules/player-portal/read-service.ts             src/platform/player-portal/postgres-player-portal-read-repository.ts             src/platform/pokedex/postgres-pokedex-writer.ts             src/platform/capture/postgres-capture-repository.ts             src/platform/encounter/postgres-encounter-repository.ts             tests/db/pokedex-writer.integration.test.ts             tests/db/player-portal-read-repository.integration.test.ts             tests/player/player-portal-read-service.test.ts

      - name: Global typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Verify runtime schema
        run: pnpm db:verify

      - name: Hub compatibility tests
        run: |
          pnpm exec vitest run             tests/db/pokedex-writer.integration.test.ts             tests/db/player-portal-read-repository.integration.test.ts             tests/player/player-portal-read-service.test.ts
