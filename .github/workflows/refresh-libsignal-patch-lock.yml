name: Refresh libsignal patch lock

on:
  push:
    branches:
      - fix/whatsapp-pairing-restart-required-v2
    paths:
      - .lock-refresh-libsignal

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/whatsapp-pairing-restart-required-v2
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Refresh lockfile deterministically
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .lock-refresh-libsignal
          git rm .github/workflows/refresh-libsignal-patch-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: refresh lockfile for libsignal patch"
          git push origin HEAD:fix/whatsapp-pairing-restart-required-v2
