name: Phase 12B Format Temp

on:
  push:
    branches:
      - work/phase12b-player360-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/phase12b-player360-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.23.0
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 12B files
        run: |
          pnpm exec biome format --write \
            db/proofs/phase12_player360_e2e.ts \
            src/modules/admin/player360-contracts.ts \
            src/modules/admin/player360-ports.ts \
            src/modules/admin/player360-service.ts \
            src/platform/admin/postgres-player360-repository.ts \
            tests/admin/player360-service.test.ts \
            src/modules/admin/definitions.ts
      - name: Commit formatted candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            db/proofs/phase12_player360_e2e.ts \
            src/modules/admin/player360-contracts.ts \
            src/modules/admin/player360-ports.ts \
            src/modules/admin/player360-service.ts \
            src/platform/admin/postgres-player360-repository.ts \
            tests/admin/player360-service.test.ts \
            src/modules/admin/definitions.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format Player 360 candidate'
          git push origin HEAD:work/phase12b-player360-v1
