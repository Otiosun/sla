name: Capture Stable Seed Context Temp

on:
  push:
    branches:
      - feat/capture-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(capture): derive RNG from stable request identity') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/capture-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
          check-latest: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch stable capture seed context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/capture/service.ts')
          text = path.read_text()
          old = '        const seed = this.seedProvider.create(`capture:${attemptId}`);'
          new = '        const seed = this.seedProvider.create(`${idempotency.value.storageKey}:${fingerprint}`);'
          if old not in text:
              raise SystemExit('Expected random-attempt seed context not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Canonical format
        run: pnpm exec biome format --write src/modules/capture/service.ts

      - name: Commit when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/modules/capture/service.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/capture/service.ts
          git commit -m "fix(capture): derive RNG from stable request identity"
          git push origin HEAD:feat/capture-v1
