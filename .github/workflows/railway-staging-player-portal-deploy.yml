name: Railway Staging Player Portal Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: railway-staging-player-portal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: immutable Railway Player Portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      APP_ENV: staging
      DEPLOY_REVISION: ${{ github.sha }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.STAGING_RAILWAY_PLAYER_PORTAL_SERVICE }}
      PLAYER_PORTAL_URL: ${{ vars.STAGING_PLAYER_PORTAL_URL }}

    steps:
      - name: Require canonical main and Player Portal target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Player Portal staging deploys must run from refs/heads/main" >&2
            exit 64
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA must be a full immutable commit SHA" >&2
            exit 64
          fi
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "RAILWAY_TOKEN is required in the staging GitHub Environment" >&2
            exit 64
          fi
          if [[ "$RAILWAY_SERVICE" != "pokemon-rpg-player-portal-staging" ]]; then
            echo "STAGING_RAILWAY_PLAYER_PORTAL_SERVICE must identify pokemon-rpg-player-portal-staging" >&2
            exit 64
          fi
          if [[ ! "$PLAYER_PORTAL_URL" =~ ^https://[^/?#]+/?$ ]]; then
            echo "STAGING_PLAYER_PORTAL_URL must be the public HTTPS origin of the Player Portal service" >&2
            exit 64
          fi

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Railway CLI
        shell: bash
        run: npm install --global @railway/cli@5.45.10

      - name: Prepare immutable image coordinate
        shell: bash
        run: |
          set -euo pipefail
          repository_lower="${GITHUB_REPOSITORY,,}"
          echo "RUNTIME_IMAGE_GHCR=ghcr.io/${repository_lower}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull, verify and pin canonical immutable runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$RUNTIME_IMAGE_GHCR"
          actual_revision="$(docker image inspect "$RUNTIME_IMAGE_GHCR" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$actual_revision" != "$GITHUB_SHA" ]]; then
            echo "runtime image revision label mismatch" >&2
            exit 1
          fi

          immutable_digest=""
          for attempt in {1..6}; do
            immutable_digest="$(docker buildx imagetools inspect "$RUNTIME_IMAGE_GHCR" 2>/dev/null | awk '/^Digest:/ { print $2; exit }')"
            if [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            immutable_digest=""
            if [[ "$attempt" -lt 6 ]]; then sleep $((attempt * 2)); fi
          done
          if [[ ! "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "immutable runtime tag did not resolve to a sha256 manifest digest" >&2
            exit 1
          fi

          repository_lower="${GITHUB_REPOSITORY,,}"
          echo "RUNTIME_IMAGE_PINNED=ghcr.io/${repository_lower}@${immutable_digest}" >> "$GITHUB_ENV"

      - name: Resolve preconfigured Railway Player Portal service
        shell: bash
        run: |
          set -euo pipefail
          services_json="$(railway service list --environment staging --json)"
          service_matches="$(jq --arg service "$RAILWAY_SERVICE" '[.[] | select(.name == $service)] | length' <<<"$services_json")"
          if [[ "$service_matches" != "1" ]]; then
            echo "Railway Player Portal service could not be resolved uniquely" >&2
            exit 1
          fi

          token_scope_json="$(railway api 'query { projectToken { projectId environmentId } }' --compact)"
          project_id="$(jq -r '.data.projectToken.projectId // empty' <<<"$token_scope_json")"
          if [[ -z "$project_id" ]]; then
            echo "Railway project token did not resolve its staging project" >&2
            exit 1
          fi
          echo "RAILWAY_PROJECT_ID=${project_id}" >> "$GITHUB_ENV"

      - name: Stage exact deployment revision
        shell: bash
        run: |
          set -euo pipefail
          railway variable set DEPLOY_REVISION=${GITHUB_SHA}             --service "$RAILWAY_SERVICE"             --environment staging             --skip-deploys             --json             >/tmp/railway-player-portal-revision.json

      - name: Deploy immutable Player Portal image
        shell: bash
        run: |
          set -euo pipefail
          baseline_json="$(railway deployment list --service "$RAILWAY_SERVICE" --environment staging --limit 1 --json)"
          baseline_id="$(jq -r '.[0].id // empty' <<<"$baseline_json")"
          echo "RAILWAY_BASELINE_DEPLOYMENT_ID=${baseline_id}" >> "$GITHUB_ENV"

          deploy_context="$RUNNER_TEMP/railway-player-portal"
          rm -rf "$deploy_context"
          mkdir -p "$deploy_context"
          {
            printf 'FROM %s\n' "$RUNTIME_IMAGE_PINNED"
            printf 'CMD ["node","dist/src/player-portal-main.js"]\n'
          } > "$deploy_context/Dockerfile"

          railway up "$deploy_context"             --path-as-root             --project "$RAILWAY_PROJECT_ID"             --environment staging             --service "$RAILWAY_SERVICE"             --detach

      - name: Wait for Player Portal deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            deployment_json="$(railway deployment list --service "$RAILWAY_SERVICE" --environment staging --limit 1 --json)"
            current_id="$(jq -r '.[0].id // empty' <<<"$deployment_json")"
            current_status="$(jq -r '.[0].status // empty' <<<"$deployment_json")"

            if [[ -n "$current_id" && "$current_id" != "$RAILWAY_BASELINE_DEPLOYMENT_ID" ]]; then
              case "$current_status" in
                SUCCESS)
                  echo "Railway Player Portal deployment ${current_id} reached SUCCESS for ${GITHUB_SHA}"
                  exit 0
                  ;;
                FAILED|CRASHED|REMOVED)
                  echo "Railway Player Portal deployment ${current_id} ended in ${current_status}" >&2
                  exit 1
                  ;;
              esac
            fi

            if [[ "$attempt" -lt 60 ]]; then sleep 5; fi
          done

          echo "Railway Player Portal deployment did not reach SUCCESS in time" >&2
          exit 1

      - name: Prove public Player Portal boundary
        shell: bash
        run: |
          set -euo pipefail
          base="${PLAYER_PORTAL_URL%/}"
          for attempt in {1..20}; do
            body_file="$RUNNER_TEMP/player-portal-smoke.json"
            status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}'               --max-time 10               --header 'accept: application/json'               "$base/v1/hub/player/self" || true)"

            if [[ "$status" == "401" ]] && jq -e '.error == "UNAUTHENTICATED"' "$body_file" >/dev/null 2>&1; then
              echo "Player Portal public boundary is healthy for ${GITHUB_SHA}"
              exit 0
            fi

            if [[ "$attempt" -lt 20 ]]; then sleep 5; fi
          done

          echo "Player Portal public boundary did not become healthy" >&2
          exit 1

      - name: Log out from GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
