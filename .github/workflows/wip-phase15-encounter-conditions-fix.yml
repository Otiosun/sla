name: WIP Phase 15 Encounter Conditions Fix

on:
  push:
    branches:
      - feat/phase15-gen123-import-wip

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/phase15-gen123-import-wip
      - name: Patch imported encounter conditions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("db/imports/gen123/import.ts")
          s = p.read_text()
          canonical = 'JSON.stringify({ schemaVersion: 1, requiredUnlockKeys: [], blockedUnlockKeys: [] })'
          table_old = 'JSON.stringify(sourceMetadata({ aggregatedVersions: "GEN_1_3" }))'
          if s.count(table_old) != 1:
              raise SystemExit("table condition marker changed")
          s = s.replace(table_old, canonical)
          encounter_marker = 'gen123Id(\n          `encounter:${releaseId}:${entry.locationId}:${entry.speciesId}:${entry.minLevel}:${entry.maxLevel}`,'
          pos = s.index(encounter_marker)
          entry_old = 'JSON.stringify(sourceMetadata())'
          entry_pos = s.index(entry_old, pos)
          s = s[:entry_pos] + canonical + s[entry_pos + len(entry_old):]
          p.write_text(s)
          PY
      - name: Commit code fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/imports/gen123/import.ts
          git diff --cached --quiet && exit 0
          git commit -m "wip: make imported encounter conditions runtime-valid"
          git push origin HEAD:feat/phase15-gen123-import-wip
