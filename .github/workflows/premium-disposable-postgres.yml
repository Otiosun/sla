name: Premium Disposable PostgreSQL Gate

on:
  pull_request:
    paths:
      - ".github/workflows/premium-disposable-postgres.yml"
      - "db/migrations/**"
      - "src/modules/entitlements/**"
      - "src/platform/entitlements/**"
      - "src/modules/premium-orders/**"
      - "src/modules/premium-support/**"
      - "src/platform/premium-orders/**"
      - "src/modules/player-portal/**"
      - "src/runtime/compose-player-portal-runtime.ts"
      - "src/modules/progression/**"
      - "src/platform/progression/**"
      - "tests/db/**"
      - "tests/player/player-portal-http-handler.test.ts"
      - "tests/progression/premium-xp2x-scope.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-db-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  premium-disposable-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: pokemon
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pokemon_rpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokemon -d pokemon_rpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      MIGRATOR_DATABASE_URL: postgresql://pokemon:test-only-password@localhost:5432/pokemon_rpg_test
      POSTGRES_INTEGRATION_TEST_URL: postgresql://pokemon:test-only-password@localhost:5432/postgres
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
      DATABASE_POOL_MAX: "12"
      DATABASE_CONNECT_TIMEOUT_MS: "5000"
      DATABASE_IDLE_TIMEOUT_MS: "30000"
      DATABASE_QUERY_TIMEOUT_MS: "10000"
      DATABASE_STATEMENT_TIMEOUT_MS: "10000"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "15000"

    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0
      - name: Install exact lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify schema on disposable database only
        run: |
          pnpm db:migrate
          pnpm db:verify
      - name: Premium contracts and race/idempotency regressions
        run: |
          pnpm exec vitest run \
            tests/db/entitlements.integration.test.ts \
            tests/db/premium-orders.integration.test.ts \
            tests/db/premium-orders-xp2x.integration.test.ts \
            tests/db/premium-http-lifecycle.integration.test.ts \
            tests/db/xp2x-policy.integration.test.ts \
            tests/player/player-portal-http-handler.test.ts \
            tests/progression/premium-xp2x-scope.test.ts
      - name: Typecheck backend
        run: pnpm typecheck
      - name: Build backend without starting services
        run: pnpm build
