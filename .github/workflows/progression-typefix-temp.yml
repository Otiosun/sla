name: Progression Typefix Temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/progression-evolution-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout progression branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/progression-evolution-v1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Ability resolution fail closed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/platform/progression/postgres-progression-repository.ts')
          text = p.read_text()

          old = '): Promise<string | null> {\n  const result = await client.query<{ ability_id: string; slot_kind: string }>(\n'
          new = '): Promise<string> {\n  const result = await client.query<{ ability_id: string; slot_kind: string }>(\n'
          if old not in text:
              raise SystemExit('ability return signature target not found')
          text = text.replace(old, new, 1)

          old = '  if (currentAbilityId !== null && result.rows.some((row) => row.ability_id === currentAbilityId)) {\n    return currentAbilityId;\n  }\n  return result.rows[0]?.ability_id ?? null;\n}\n'
          new = '  if (currentAbilityId !== null && result.rows.some((row) => row.ability_id === currentAbilityId)) {\n    return currentAbilityId;\n  }\n  const fallback = result.rows[0]?.ability_id;\n  if (fallback === undefined) {\n    throw new ProgressionStateViolation("Evolution target has no active Ability option");\n  }\n  return fallback;\n}\n'
          if old not in text:
              raise SystemExit('ability fallback target not found')
          text = text.replace(old, new, 1)

          old = '    let currentFormId = row.form_id;\n    let currentAbilityId = row.ability_id;\n    let previousLevel = row.level;'
          new = '    let currentFormId = row.form_id;\n    if (row.ability_id === null) {\n      throw new ProgressionStateViolation("Winning Pokemon has no persisted Ability");\n    }\n    let currentAbilityId: string = row.ability_id;\n    let previousLevel = row.level;'
          if old not in text:
              raise SystemExit('persisted ability narrowing target not found')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
          pnpm exec biome check --write src/platform/progression/postgres-progression-repository.ts
          pnpm typecheck

      - name: Commit type fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/progression/postgres-progression-repository.ts
          git commit -m "fix: make progression ability resolution fail closed"
          git push origin HEAD:feat/progression-evolution-v1
