name: Progression Evolution Source Text Temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/progression-evolution-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout progression branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/progression-evolution-v1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make evolution claim source identifier textual
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/platform/progression/postgres-progression-repository.ts')
          text = p.read_text()
          old = "'PLAYER_ACTION', $2,\n                   'progression.evolve', $9, $10, $11, $12::jsonb)"
          new = "'PLAYER_ACTION', $2::text,\n                   'progression.evolve', $9, $10, $11, $12::jsonb)"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one evolution claim source target, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          pnpm exec biome check --write src/platform/progression/postgres-progression-repository.ts
          pnpm typecheck
          pnpm exec vitest run tests/progression

      - name: Commit validated source-id fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/progression/postgres-progression-repository.ts
          git commit -m "fix: serialize evolution claim source id"
          git push origin HEAD:feat/progression-evolution-v1
