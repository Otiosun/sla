name: Capture Server Authority Temp

on:
  push:
    branches:
      - feat/capture-v1

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/capture-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove client-controlled capture modifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path_s, old, new, count=1):
              path = Path(path_s)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path_s}: {old[:80]!r}')
              path.write_text(text.replace(old, new, count))

          replace(
              'src/modules/capture/contracts.ts',
              '  readonly causationId: string | null;\n  readonly explicitModifierBasisPoints?: readonly number[];\n',
              '  readonly causationId: string | null;\n',
          )
          replace(
              'src/modules/capture/contracts.ts',
              '  readonly ball: CaptureItemPolicy;\n}\n',
              '  readonly ball: CaptureItemPolicy;\n  readonly explicitModifierBasisPoints: readonly number[];\n}\n',
          )
          replace(
              'src/modules/capture/contracts.ts',
              '    causationId: uuid.nullable(),\n    explicitModifierBasisPoints: z.array(basisPoints).max(16).optional(),\n',
              '    causationId: uuid.nullable(),\n',
          )

          service = Path('src/modules/capture/service.ts')
          text = service.read_text()
          old_func = '''function sortedModifiers(input: CaptureAttemptInput): readonly number[] {
            return [...(input.explicitModifierBasisPoints ?? [])].sort((left, right) => left - right);
          }

          '''.replace('          ', '')
          if old_func not in text:
              raise SystemExit('sortedModifiers helper not found')
          text = text.replace(old_func, '', 1)
          text = text.replace(
              '        explicitModifierBasisPoints: sortedModifiers(input),\n',
              '',
              1,
          )
          text = text.replace('    const modifiers = sortedModifiers(input);\n', '', 1)
          text = text.replace(
              '          explicitModifierBasisPoints: modifiers,\n',
              '          explicitModifierBasisPoints: context.explicitModifierBasisPoints,\n',
              1,
          )
          service.write_text(text)

          replace(
              'src/platform/capture/postgres-capture-repository.ts',
              '        effectConfig: itemRow.effect_config,\n      },\n    };\n',
              '        effectConfig: itemRow.effect_config,\n      },\n      explicitModifierBasisPoints: [],\n    };\n',
          )

          probability = Path('src/modules/capture/probability.ts')
          text = probability.read_text()
          text = text.replace(
              '  const statusMultiplier = statusMultiplierBasisPoints(value.status);\n\n  let probability',
              '  const statusMultiplier = statusMultiplierBasisPoints(value.status);\n  const explicitModifiers = [...value.explicitModifierBasisPoints].sort((left, right) => left - right);\n\n  let probability',
              1,
          )
          text = text.replace(
              '  for (const modifier of value.explicitModifierBasisPoints) {\n',
              '  for (const modifier of explicitModifiers) {\n',
              1,
          )
          text = text.replace(
              '      explicitModifierBasisPoints: [...value.explicitModifierBasisPoints],\n',
              '      explicitModifierBasisPoints: explicitModifiers,\n',
              1,
          )
          probability.write_text(text)

          e2e = Path('db/proofs/phase10_capture_e2e.ts')
          text = e2e.read_text()
          text = text.replace('    explicitModifierBasisPoints: [100_000],\n', '')
          e2e.write_text(text)

          outbox = Path('db/proofs/phase10_capture_outbox_replay.ts')
          text = outbox.read_text().replace('      explicitModifierBasisPoints: [100_000],\n', '')
          outbox.write_text(text)

          seed_test = Path('tests/capture/capture-service-seed-context.test.ts')
          text = seed_test.read_text()
          text = text.replace(
              '      effectConfig: { multiplierBasisPoints: 10_000 },\n    },\n  };\n',
              '      effectConfig: { multiplierBasisPoints: 10_000 },\n    },\n    explicitModifierBasisPoints: [],\n  };\n',
              1,
          )
          start = text.index('  it("changes context for a semantic modifier change')
          end = text.index('\n  });', start) + len('\n  });')
          replacement = '''  it("changes context when the semantic idempotency identity changes", async () => {
            const value = context();
            const contexts: string[] = [];
            const seedProvider = {
              create(seedContext: string): never {
                contexts.push(seedContext);
                throw new Error("seed context probe");
              },
            } satisfies CaptureSeedProvider;
            const service = new CaptureService(repository(value), seedProvider);
            const base = {
              playerId: value.playerId,
              encounterId: value.encounterId,
              expectedEncounterRevision: value.encounterRevision,
              expectedBattleVersion: null,
              ballItemId: value.ball.itemId,
              correlationId: createCorrelationId(),
              causationId: null,
            } as const;

            await service.attempt({ ...base, idempotencyKey: "semantic-message-a" });
            await service.attempt({ ...base, idempotencyKey: "semantic-message-b" });

            expect(contexts).toHaveLength(2);
            expect(contexts[0]).not.toBe(contexts[1]);
          });'''.replace('          ', '')
          text = text[:start] + replacement + text[end:]
          seed_test.write_text(text)

          probability_test = Path('tests/capture/capture-probability.test.ts')
          text = probability_test.read_text()
          marker = '  it("returns zero for catchRate zero regardless of bonuses", () => {'
          insert = '''  it("canonicalizes explicit modifier order before integer rounding", () => {
            const forward = captureProbability(
              input({ explicitModifierBasisPoints: [12_345, 17_891] }),
            );
            const reversed = captureProbability(
              input({ explicitModifierBasisPoints: [17_891, 12_345] }),
            );

            expect(forward).toEqual(reversed);
            expect(forward.breakdown.explicitModifierBasisPoints).toEqual([12_345, 17_891]);
          });

          '''.replace('          ', '')
          if marker not in text:
              raise SystemExit('Probability insertion marker missing')
          probability_test.write_text(text.replace(marker, insert + marker, 1))
          PY

      - name: Canonical format
        run: pnpm exec biome format --write src/modules/capture src/platform/capture tests/capture db/proofs/phase10_capture_e2e.ts db/proofs/phase10_capture_outbox_replay.ts

      - name: Quality gate
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm exec vitest run tests/capture
          git diff --check

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/capture-server-authority-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(capture): keep capture modifiers server authoritative"
          git push origin HEAD:feat/capture-v1
