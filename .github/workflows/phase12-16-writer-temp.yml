name: Phase 12.16 Writer Temp

on:
  push:
    branches:
      - work/phase12-16-patch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/phase12-16-patch

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact pnpm
        run: npm install --global pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded patch
        run: python tools/phase12_16_patch_temp.py

      - name: Format touched code
        run: |
          pnpm exec biome format --write \
            src/modules/pokemon/admin-contracts.ts \
            src/modules/pokemon/admin-service.ts \
            src/modules/pokemon/lifecycle-admin-ports.ts \
            src/platform/pokemon/postgres-pokemon-lifecycle-admin-repository.ts \
            src/modules/admin/domain-contracts.ts \
            src/modules/admin/domain-ports.ts \
            src/modules/admin/domain-definitions.ts \
            src/modules/admin/domain-service.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit validated code only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "phase12-writer"
          git config user.email "phase12-writer@users.noreply.github.com"
          git add src/modules/pokemon src/platform/pokemon src/modules/admin
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "wip: wire Phase 12.16 Pokemon lifecycle owner"
          git push origin HEAD:work/phase12-16-patch
